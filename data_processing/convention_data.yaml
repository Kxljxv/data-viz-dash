    - '540':
        type: motion
        id: 540
        agenda_item: Beschlüsse (vorläufig)
        prefix: V-10 Beschluss
        title: 'Grüner Aufbruch für faire Mieten '
        title_with_intro: 'Grüner Aufbruch für faire Mieten '
        title_with_prefix: 'V-10 Beschluss: Grüner Aufbruch für faire Mieten '
        status_id: 3
        status_title: Eingereicht
        date_published: null
        supporters: []
        initiators:
          type: null
          name: null
          organization: null
        initiators_html: 'Bundesdelegiertenkonferenz (beschlossen am: 27.01.2018)'
        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p><strong>Grüner
              Aufbruch für faire Mieten </strong></p>

              <p>Das Vorhandensein von bezahlbarem Wohnraum ist eine der zentralen
              sozialen Fragen unserer Zeit. Immer weniger Menschen können sich die
              hohen und steigenden Mieten in unseren Städten und Ballungsräumen noch
              leisten. Immer mehr Menschen, auch aus der Mittelschicht, sind von Verdrängung
              bedroht. Es vergeht kaum ein Tag, an dem nicht über die aufgeheizte
              Situation auf unseren Wohnungsmärkten berichtet wird. Besonders alarmierend
              sind die Zahlen über die Verdoppelung der Wohnungs- und Obachlosen seit
              2014 auf 860 000 Menschen. Es ist für uns zentral, das Primat des Gemeinwohls
              in der Mieten- und Wohnungspolitik wieder herzustellen.</p>

              <p>Trotz der mit großem Tamtam angekündigten Mietpreisbremse steigen
              die Mieten in den Ballungszentren ungebremst weiter. Seit ihrer Einführung
              sogar noch schneller als vorher. Die Sondierungen mit Union und FDP
              haben deutlich gezeigt, dass sie keinen Schwerpunkt auf die Interessen
              von Mieterhaushalten legen. Wir Grüne waren es, die sich für eine funktionierende
              Mietpreisbremse und für mehr Investitionen in sozialgebundenen Wohnungsbau
              eingesetzt haben. Denn wir Grüne verstehen die Versorgung mit Wohnraum
              als Aufgabe der öffentlichen Daseinsvorsorge.</p>

              <p>Verschärft wird die Situation durch spekulative Finanzinvestoren
              mit Sitz in Steueroasen, die oft gezielt bestehende Steuerschlupflöcher
              nutzen, um ihre Gewinne am Allgemeinwohl vorbei zu schleusen. So werden
              zum Beispiel in großem Umfang Immobilien in Deutschland gekauft, ohne
              dass dafür ein Cent Grunderwerbsteuer gezahlt wird. Dazu braucht es
              nur einen sogenannten Share Deal – dabei wird nicht das Grundstück selbst,
              sondern das Unternehmen, in dem das Grundstück enthalten ist, gekauft.
              Anschließend werden laufende Mieteinnahmen in Deutschland mit Hilfe
              von Gesellschaften in Luxemburg kaum versteuert. Die bestehenden Mieterhöhungsmöglichkeiten
              und Schutzlücken im deutschen Mietrecht werden gleichzeitig voll ausgenutzt,
              auch um gezielt zu entmieten. Gerade die in manchen Städten massiv zunehmende
              Umwandlung von Miet- in Eigentumswohnungen, die als Anlageobjekt dann
              einzeln verkauft werden, sorgt für massive Mietsteigerungen und Verdrängung.
              Mieter*innen wissen oftmals nicht, wer eigentlich ihr Vermieter ist,
              ihre Miete landet bei Briefkastenfirmen oder Strohmännern.</p>

              <p>Es klafft eine riesige Lücke zwischen den drängenden Problemen auf
              den wachsenden Wohnungsmärkten und den politischen Maßnahmen, diese
              Missstände zu beheben. Deshalb braucht es endlich einen Paradigmenwechsel
              in der Wohnungspolitik. Hin zu weniger Mieterhöhungsmöglichkeiten, dem
              Stopp von Immobilienspekulation zu dauerhaft bezahlbaren Wohnungen und
              zu einer sozial-gerechten Bodenpolitik. Wir Grüne sind die Partei, die
              sich für die Interessen der Mieterinnen und Mieter einsetzt, um den
              Zusammenhalt in unserer Gesellschaft zu erhalten und zu stärken.</p>

              <p>Das Mantra „Bauen, Bauen, Bauen“ von CDU/CSU, FDP und SPD allein
              hilft eben nicht, um die Mietkosten zu bremsen. Es braucht entschlossenes
              Handeln statt einseitiger interessengeleiteter Analysen.</p>

              <p><strong>Eine Million dauerhaft günstige Wohnungen </strong></p>

              <p>Die Zeit des Verkaufs und der Spekulation mit Sozialwohnungen muss
              enden. Wir wollen eine Million zusätzliche preiswerte Wohnungen. Im
              Neubau wie im Bestand, dauerhaft günstig und lebenswert, möglichst nicht
              auf der grünen Wiese, sondern innerhalb unserer Städte und Dörfer. Mit
              dem Konzept der Neuen Wohnungsgemeinnützigkeit werden wir wieder Genossenschaften,
              kommunale Wohnungsunternehmen und private Investor*innen für den sozialen
              Wohnungsbau gewinnen. Das Prinzip dabei ist: Zulagen und Steuerförderung
              im Tausch gegen dauerhaft günstigen Wohnraum.</p>

              <p><strong>Mietpreise und Spekulation bremsen – für ein soziales Mietrecht
              ohne Schlupflöcher </strong></p>

              <p>Die Mieten explodieren seit Jahren. Damit muss jetzt Schluss sein.
              Die Mietpreisbremse muss endlich angezogen und unnötige Ausnahmen abgeschafft
              werden. Ihre Geltung muss dringend verlängert werden, damit sie nicht
              2020 ausläuft. Sie muss als ein dauerhaftes Instrument im Mietrecht
              erhalten bleiben, dass dann zeitlich befristet zur Anwendung kommt,
              wenn Wohnraummangelgebiete entstehen. Niemand darf unter dem Deckmantel
              der energetischen Modernisierung verdrängt werden, beispielsweise durch
              die Fassadendämmung von Altbauten. Die Modernisierungsumlage in ihrer
              jetzigen Form ist schädlich. Wir Grüne werden daher prüfen, inwiefern
              die Modernisierungsumlage in ein anderes sozial-gerechteres und ökologischeres
              Instrument umgewandelt werden kann. Kurzfristig kappen und senken wir
              sie deutlich ab, konzentrieren sie nur noch auf gesellschaftlich notwendige
              Bereiche und schaffen eine neue, faire Kostenverteilung. Der Mietspiegel
              soll die Miethöhen über einen deutlich längeren Zeitraum abbilden. Wo
              es einen qualifizierten Mietspiegel gibt, soll er verpflichtend für
              alle Teilnehmer*innen auf dem Wohnungsmarkt gelten. Auch die Zeitspanne
              ohne Mieterhöhungsmöglichkeiten muss ausgeweitet werden. Ländern soll
              es möglich sein, Mieterhöhungen ohne Wohnwertverbesserungen auf maximal
              15 Prozent innerhalb von fünf Jahren zu kappen. Wir wollen das Instrument
              des Milieuschutzes als Mieterschutzinstrument weiter entwickeln und
              Mietobergrenzen ermöglichen. In angespannten Wohnungsmärkten sollen
              die Umwandlung von Miet- in Eigentumswohnungen stadtweit und lückenlos
              der Genehmigungspflicht unterliegen können.</p>

              <p>Der Schutz der Mieter*innen vor überhöhten Mietforderungen im Wirtschaftsstrafrecht
              soll verbessert werden. Auch der Schutz für Kündigungen wegen Eigenbedarfs,
              unverschuldeten Mietrückständen und bei Umwandlungen in Eigentum soll
              ausgeweitet werden. Die Mieter*innenschutzverbände wollen wir mit Gruppenklagemöglichkeiten
              stärken. Zudem wollen wir das, den Mieter*innen beim Verkauf der Wohnung
              zustehende Vorkaufsrecht, auch auf Genossenschaften, welche die Mieter*innen
              gründen können, ausweiten.</p>

              <p>Das Wohngeld wollen wir verdoppeln, dynamisch anpassen und die Heizkosten
              wieder berücksichtigen. Ergänzend führen wir einen Klimazuschuss für
              energetisch modernisierte Wohnungen ein, damit auch Wohngeldempfänger*innen
              energieeffizient wohnen können.</p>

              <p>Auch kleine Gewerbemieter und soziale Träger wollen wir bundesweit
              mit dem Ausbau des Gewerbemietrechts (Kündigungsschutz, Erweiterung
              des Milieuschutzes, Gewerbemietspiegel mit Mietpreisbremse, etc.) unterstützen.</p>

              <p><strong>Zukunftsfähige Bodenpolitik</strong></p>

              <p>Die stark steigenden Grundstückspreise sind ein riesiges Hindernis
              für die Schaffung von bezahlbaren Wohnraum und die Bereitstellung von
              leistbaren Mietwohnungen. Deswegen ist die Bodenpolitik eine der zentralen
              wohnungspolitischen Handlungsfelder in den kommenden Jahren. Unser Ziel
              ist ein zukunftsfähiger und sozial-gerechter Umgang mit der begrenzten
              Ressource Boden, auch in unseren Städten. Wir wollen die Entwicklung
              von bezahlbaren Bauflächen in unseren Städten stärken.</p>

              <p>Für uns gilt der Grundsatz: Innen- vor Außenentwicklung. Das Baugesetzbuch
              muss systematisch dahingehend überprüft werden, inwiefern Gemeinden
              bei der Sicherung und Bereitstellung von Grundstücken besser unterstützt
              werden können. Wenn immer nur der meistbietende Investor den Zuschlag
              erhalten kann, haben Anbieter von günstigen und bezahlbaren Mietwohnungen
              keine Chance. Hier braucht es Verbesserungen beim kommunalen Vorkaufsrecht.
              Bei der Wertermittlung des Verkehrswertes wollen wir vom reinen Marktwert
              weg und ein Berechnungsmodell entwickeln, das spekulative Wertsteigerungen
              nicht mehr enthält. Auch bei Zwangsversteigerungen soll zukünftig ein
              Vorkaufrecht bestehen. Außerdem wollen wir neue städtebauliche Instrumente,
              mit denen kleinteilige innerstädtische Grundstücke schneller und preisgünstiger
              nutzbar gemacht werden können. Die Einführung einer neuen Kategorie
              „Maßnahmengebiet der Innenentwicklung“ könnte eine Möglichkeit sein,
              verbliebene kleinteilige Flächen zu aktivieren. Innenverdichtung und
              Aufstockung wollen wir zusätzlich durch eine nationale Holzbaustrategie
              und eine Offensive bei seriellen und modularen Bauen erleichtern. So
              können in Zukunft schnell, preiswert und ressourcenschonend bezahlbare
              Wohnungen in unseren Städten entstehen. Auch bei der Wiedernutzung alter
              Industrieflächen brauchen die Gemeinden Unterstützung von Seiten des
              Bundes über baurechtliche Änderungen, KfW-Förderung oder Städtebaufördermittel.</p>

              <p>Gemeinden unterstützen wir außerdem mit der Neuen Wohnungsgemeinnützigkeit
              bei der Verknüpfung von neuem Baurecht mit Mindestanteilen an sozialem
              Wohnraum und anderen wohnungs- und städtebaulichen Erfordernissen.</p>

              <p>Statt zu spekulieren, muss der Bund eine Vorreiterrolle bei der Bereitstellung
              und Sicherung von bezahlbaren Grundstücken einnehmen. Dafür wollen wir
              das Gesetz über die Bundesanstalt für Immobilienaufgaben und die Bundeshaushalts­ordnung
              entsprechend ändern. Grundstücke sollen für wohnungspolitische, städtebauliche
              und strukturpolitische Ziele vergünstigt zum Verkehrswert und wo nötig
              auch darunter an die Kommunen verkauft werden können. Damit werden preistreibende
              Bieterverfahren vermieden und die zukünftige Nutzung der Grundstücke
              in den Kommunen berücksichtigt. Auch die Weitergabe an gemeinwohlorientierte
              Träger und die Verpachtung in Erbpacht sollte ermöglicht werden.</p>

              <p>Damit spekulative Finanzinvestoren und große Wohnungsunternehmen
              den gemeinwohlorientierten Akteuren auch steuerrechtlich gleichgestellt
              werden, wollen wir die sogenannten Share Deals abschaffen. Ergänzend
              setzen wir uns für ein zentrales vernetztes Immobilienregister ein,
              in dem die Eigentümer der Immobilien für Behörden und für alle Betroffenen
              (Mieter) abrufbar sind, um Geldwäsche im Immobiliensektor entgegen zu
              treten.</p></div>'
            layout_right: false
