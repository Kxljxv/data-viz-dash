    - '546':
        type: motion
        id: 546
        agenda_item: Beschlüsse (vorläufig)
        prefix: V-17 Beschluss
        title: Weitere Demokratisierung und Europäisierung der Europawahl 2019
        title_with_intro: Weitere Demokratisierung und Europäisierung der Europawahl
          2019
        title_with_prefix: 'V-17 Beschluss: Weitere Demokratisierung und Europäisierung
          der Europawahl 2019'
        status_id: 3
        status_title: Eingereicht
        date_published: null
        supporters: []
        initiators:
          type: null
          name: null
          organization: null
        initiators_html: 'Bundesdelegiertenkonferenz (beschlossen am: 27.01.2018)'
        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p>Bündnis 90/Die
              Grünen setzen sich dafür ein, dass die Europawahl 2019 noch demokratischer
              und europäischer wird. Wir unterstützen die Idee von transnationalen
              Listen sowie den Vorschlag, möglichst viele der voraussichtlich durch
              den Brexit frei werdenden Sitze im Europäischen Parlament in Zukunft
              über transnationale/europaweite Listen zu besetzen anstatt diese einfach
              an die 27 verbleibenden Mitgliedsstaaten zu verteilen. Wir laden die
              Bundestagsfraktion ein mit einem Antrag die Bundesregierung aufzufordern,
              sich auf europäischer Ebene ebenfalls für transnationale/europaweite
              Listen einzusetzen.</p>

              <p>Wir unterstützen den Vorschlag des französischen Präsidenten Emmanuel
              Macron, mittelfristig die Hälfte aller Europaabgeordneten über transnationale
              Listen zu wählen. Ein solches Wahlverfahren würde ähnlich zur Wahl des
              Deutschen Bundestages dafür sorgen, dass das Parlament das Wahlergebnis
              insgesamt besser wiederspiegelt und alle Bürger*innen auch weiterhin
              durch Wahkreisabgeordnete repräsentiert werden. Transnationale Listen
              könnten somit einen Beitrag zur Schaffung einer europäischen Öffentlichkeit
              und eines wirklich europäisierten Wahlkampfs liefern. Dadurch hoffen
              wir, die europäische Politik noch demokratischer zu gestalten. Durch
              transnationale/europaweite Listen kann im europäischen Parlament eine
              neue Dynamik entstehen, die noch stärker zu gesamteuropäischer Verantwortung
              und Verpflichtung der Abgeordneten führt. Dies ist uns in Zeiten des
              erstarkenden Nationalismus überall in Europa besonders wichtig. Außerdem
              setzen wir uns für einen weiteren Abbau von Wahlhürden aufgrund von
              Alter, Beeinträchtigung und Staatszugehörigkeit auch auf europäischer
              Ebene ein.</p>

              <p>Wir unterstützen weiterhin das Prinzip der Europäischen Spitzenkandidat*innen.
              Wir setzen uns dafür ein, dass die Europäische Grüne Partei (EGP) 2019
              wieder mit einer Doppelspitze antritt. Selbstverständlich sollten die
              beiden Spitzenkandidat*innen quotiert sein und nicht aus dem selben
              Mitgliedsstaat kommen. Sobald die Möglichkeit einer Transnationalen
              Liste besteht, sollten die Spitzenkandidat*innen eine Europäische Grüne
              Liste anführen.</p>

              <p>Wir bedauern, dass es diesmal keine Urwahl der Spitzenkandidat*innen
              geben wird und werden uns als Partei innerhalb der EGP dafür stark machen,
              dass bei der übernächsten Europawahl 2024 wieder eine europaweite Urwahl
              stattfinden wird. Wir möchten die guten Erfahrungen aus vergangenen
              Europawahlkämpfen ausbauen und sowohl die EGP als auch unsere europäischen
              Grünen Schwesterparteien einladen, im Wahlkampf soviel wie möglich gemeinsame,
              grenzüberschreitende Veranstaltungen sowie ein gemeinsames Auftreten
              zu organisieren. Wir wünschen uns, dass die EGP in Abstimmung mit den
              Mitgliedsparteien eine breite Rahmenkampagne mit einem klaren Online-Schwerpunkt
              entwickelt, aber zum Beispiel auch Wahlkampfmaterialien in weiteren
              EU-Sprachen zur Verfügung stellt, um europäische Wahlkämpfer*innen besonders
              anzusprechen.</p>

              <p>Bündnis 90/Die Grünen setzen sich für einen möglichst europäischen
              Wahlkampf zur Europawahl 2019 ein. Der Wahlkampf sollte die Mehrsprachigkeit
              und Diversität Europas wiederspiegeln. Viele EU-Bürger*innen, die in
              den letzten Jahren nach Deutschland gekommen sind, sind potentielle
              Grüne Wähler*innen und die Europawahl ist eine einzigartige Möglichkeit,
              diese Menschen anzusprechen. Deshalb sollte mindestens eine längere
              Zusammenfassung des Wahlprogramms auch auf Englisch bereitgestellt werden.
              Auch das Wahlmanifesto der EGP sollte wieder als Teil unseres Wahlprogramms
              beschlossen werden und dann im Wahlkampf allen Wähler*innen zur Verfügung
              gestellt werden. Die Zugehörigkeit zu einer europaweiten, grünen Wahlkampagne
              soll auch durch die Nutzung gemeinsamer Kampagnenelemente deutlich gemacht
              werden.</p></div>'
            layout_right: false
        - Begründung:
            type: TextSimple
            title: Begründung
            html: ''
            layout_right: false
