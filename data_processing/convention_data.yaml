    - '542':
        type: motion
        id: 542
        agenda_item: Beschlüsse (vorläufig)
        prefix: V-23 Beschluss
        title: 'Das Leid im Jemen lindern: Rüstungsexporte stoppen!'
        title_with_intro: 'Das Leid im Jemen lindern: Rüstungsexporte stoppen!'
        title_with_prefix: 'V-23 Beschluss: Das Leid im Jemen lindern: Rüstungsexporte
          stoppen!'
        status_id: 3
        status_title: Eingereicht
        date_published: null
        supporters: []
        initiators:
          type: null
          name: null
          organization: null
        initiators_html: 'Bundesdelegiertenkonferenz (beschlossen am: 27.01.2018)'
        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p>Seit Jahren
              leiden die Menschen im Jemen unter einem brutalen Krieg und seinen schrecklichen
              Folgen. Er hat für eine der größten humanitären Katastrophen der Welt
              gesorgt. Seit Kriegsbeginn sind bereits über 10.000 Menschen an den
              direkten Folgen der Kampfhandlungen gestorben, zahllose weitere an Hunger
              und Krankheiten. Fast eine Million Menschen sind mit Cholera infiziert
              und können wegen fehlender medizinischer Versorgung und dem fast vollständigen
              Kollaps öffentlicher Dienstleistungen nur unzureichend versorgt werden.
              7 Millionen Menschen sind akut vom Hunger bedroht. Über hundert Kinder
              sterben täglich an akuter Mangelernährung und ihren Folgen, mehr als
              11 Millionen Kinder sind dringend auf humanitäre Hilfe angewiesen. Die
              Trinkwasserversorgung in den großen Städten ist nahezu vollständig zusammengebrochen.
              Diese dramatische Lage führt dazu, dass fast 20 Millionen Menschen auf
              Hilfe angewiesen sind.</p>

              <p>Dieses Ausmaß von Leid und Zerstörung im Jemen ist in erster Linie
              durch die äußere Intervention in einen ursprünglich lokalen Konflikt
              verursacht worden – vor allem durch die Bombenangriffe einer Staatenkoalition
              unter Führung Saudi-Arabiens. Sie finden mit Unterstützung der USA und
              Großbritanniens statt und durch Waffen aus europäischer Herstellung.
              Diese Angriffe richten sich oft gezielt gegen zivile Infrastruktur wie
              Schulen und Krankenhäuser. Fast alle Mitglieder der Staatenkoalition
              sind Empfänger von direkten oder indirekten Waffenlieferungen aus Deutschland.
              Zudem produziert Saudi-Arabien in Lizenz deutsche Gewehre. Auch der
              Iran hat mit seiner Unterstützung der Houthi-Milizen zu dieser Eskalation
              beigetragen: diese haben mit ihrem gewaltsamen Feldzug nach Sana’a und
              Aden und dem daraus resultierenden Sturz der Regierung Hadi den Konflikt
              zuallererst begonnen.</p>

              <p>Neben den eigentlichen Kriegshandlungen ist die illegale Seeblockade
              durch Saudi-Arabien und die Vereinigten Arabischen Emirate die bedeutendste
              Ursache für die Mangelernährung der Bevölkerung. Trotz der Existenz
              eines Kontrollmechanismus der Vereinten Nationen bringen diese Staaten
              dadurch – unter dem Vorwand, Waffenschmuggel verhindern zu wollen –
              die Versorgung großer Teile des Landes nahezu zum Erliegen. Diese Blockade,
              ebenso wie die Schließung des Flughafens Sana’a, die Belagerung von
              Städten und weitere Behinderungen humanitären Zugangs verstoßen gegen
              die Bestimmungen der Sicherheitsratsresolutionen 2140 und 2216 und können
              entsprechend sanktioniert werden. Auch der Zugang der Vereinten Nationen,
              humanitärer Organisationen sowie von Journalistinnen und Journalisten
              wird massiv behindert.</p>

              <p>Der Wechsel des ehemaligen Präsidenten Ali Abdallah Saleh auf die
              Seite der saudisch-geführten Koalition und seine Ermordung durch die
              ehemals mit ihm verbündeten Houthi-Milizen stellen den Jemen vor neue
              politische Herausforderungen. Die verschärften Auseinandersetzungen
              haben zu noch mehr Opfern in der Zivilbevölkerung geführt. Gewaltsame
              Angriffe auf friedliche Demonstrantinnen und Demonstranten sowie die
              Blockade elektronischer Kommunikation gehören neben zahlreichen Fällen
              von Verschwindenlassen, Folter und außergerichtlichen Tötungen sowie
              dem Einsatz von Kindersoldaten zu den Vergehen aller Kriegsparteien.</p>

              <p>Wir begrüßen es daher, dass der UN-Menschenrechtsrat mit der 36/31
              des VN-Menschenrechtsrats eine unabhängige Expertenkommission zur Untersuchung
              möglicher Kriegsverbrechen im Jemen eingesetzt hat. Wir begrüßen ebenfalls
              den auch auf Betreiben der Grünen Fraktion im Europäischen Parlament
              zustandegekommenen Beschluss 2017/2849, der unter anderem die Forderung
              nach einem Exportstopp von Rüstungsgütern an die kriegsführenden Staaten
              enthält.</p>

              <p>Nun muss die Bundesregierung handeln. Wir fordern sie auf:</p>

              <ul>

              <li>im Sinne wiederholter Beschlüsse des Europäischen Parlaments jegliche
              Rüstungsexporte an die am Jemenkrieg beteiligten Staaten sofort zu stoppen,
              keine neuen Genehmigungen an diese Staaten zu erteilen, erfolgte Genehmigungen
              zu widerrufen und auch keine Ausfuhrgenehmigungen zu erteilen;</li>

              </ul>

              <ul>

              <li>in Zusammenarbeit mit den VN die Initiative für neue Friedensgespräche
              zu übernehmen, deren erstes Ziel ein schnellstmöglicher Waffenstillstand
              und die Gewährung humanitären Zugangs sein muss;</li>

              </ul>

              <ul>

              <li>sich in diesem Zusammenhang auch gegenüber der US-amerikanischen
              und britischen Regierungen für ein Ende der militärischen Unterstützung
              der arabischen Koalition einzusetzen;</li>

              </ul>

              <ul>

              <li>auf alle Kriegsparteien einzuwirken, den Zugang für Hilfs- und Lebensmittellieferungen
              uneingeschränkt sicherzustellen;</li>

              </ul>

              <ul>

              <li>sich im Falle der Behinderung humanitären Zugangs, wie in Sicherheitsratsresolutionen
              2140 und 2216 vorgesehen, für Sanktionen gegen die Verantwortlichen
              aller Kriegsparteien einzusetzen;</li>

              </ul>

              <ul>

              <li>den Jemen weiter humanitär zu unterstützen und den Nachbarstaaten
              bei der Aufnahme und Versorgung der Flüchtlinge aus dem Jemen zu helfen;</li>

              </ul>

              <ul>

              <li>die Arbeit der vom VN-Menschenrechtsrat eingesetzten Expertenkommission
              nach allen Kräften zu unterstützen und dabei besonders deren uneingeschränkten
              Zugang zum Kriegsgebiet einzufordern;</li>

              </ul>

              <ul>

              <li>die Umsetzung des Beschlusses 2017/2849 des Europäischen Parlaments
              nach Kräften zu unterstützen.</li>

              </ul></div>'
