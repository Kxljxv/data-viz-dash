            html: '<div class="text motionTextFormattings textOrig"><p>§ 15 Abs. 4
              der Satzung des Bundesverbandes Bündnis 90/Die Grünen wird zur Konkretisierung
              um einen Satz 3 erweitert, der wie folgt lautet: „Werden in Satz 2 bezeichnete
              Personen in den Bundesvorstand gewählt oder erlangen Mitglieder des
              Bundesvorstandes ein solches Amt, so haben sie eines der Ämter in einer
              Übergangsfrist von acht Monaten niederzulegen.“</p></div>'
