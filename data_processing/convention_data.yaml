    - '545':
        type: motion
        id: 545
        agenda_item: Beschlüsse (vorläufig)
        prefix: V-22 Beschluss
        title: Europäische Kooperation im Verteidigungsbereich nutzen – Das Friedensprojekt
          Europa stärken!
        title_with_intro: Europäische Kooperation im Verteidigungsbereich nutzen –
          Das Friedensprojekt Europa stärken!
        title_with_prefix: 'V-22 Beschluss: Europäische Kooperation im Verteidigungsbereich
          nutzen – Das Friedensprojekt Europa stärken!'
        status_id: 3
        status_title: Eingereicht
        date_published: null
        supporters: []
        initiators:
          type: null
          name: null
          organization: null
        initiators_html: 'Bundesdelegiertenkonferenz (beschlossen am: 27.01.2018)'
        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p>Die Europäische
              Union ist ein Friedensprojekt. Es ist eine historische Errungenschaft,
              dass Konflikte heute am Verhandlungstisch und nicht länger auf Schlachtfeldern
              ausgetragen werden. 2012 wurde die EU für diesen Einsatz für Frieden,
              Versöhnung, Demokratie und Menschenrechte in Europa mit dem Friedensnobelpreis
              ausgezeichnet – zu Recht! Insbesondere mit dem Vertrag von Lissabon
              hat sie es sich zur Aufgabe gemacht, auch nach außen kohärent zu wirken:
              „Frieden zu erhalten, Konflikte zu verhüten und die internationale Sicherheit
              zu stärken“. Kein Mitgliedsstaat der EU kann diesen Aufgaben alleine
              gerecht werden. Will die EU bei der Reduzierung von Instabilität, der
              Bekämpfung von massiven Menschenrechtsverletzungen und der Beendigung
              von Krisen in ihrer unmittelbaren Nachbarschaft und darüber hinaus eine
              wirkliche Rolle spielen, müssen ihre Mitgliedsstaaten im Bereich der
              Außen-, Sicherheits- und Verteidigungspolitik viel stärker kooperieren
              als bisher.</p>

              <p>Erste Schritte hin zu mehr Kooperation wurden in den letzten zwei
              Jahren gegangen. Die Hohe Vertreterin Mogherini hat 2016 die „Globale
              Strategie für die Außen- und Sicherheitspolitik der Europäischen Union“
              veröffentlicht. 2017 hat die Europäische Kommission das „Reflexionspapier
              über die Zukunft der europäischen Verteidigung“ lanciert und im Dezember
              2017 wurden 17 Kooperationsprojekten im Rahmen der Ständigen Strukturierten
              Zusammenarbeit (Permanent Structured Cooperation, PESCO) geschaffen.
              PESCO ist ein Format der unterschiedlichen Geschwindigkeiten, an dem
              nur die Mitgliedsstaaten teilnehmen, die das wollen und sich bereit
              erklären, die entsprechenden Kriterien zu erfüllen. Trotzdem haben 25
              von 28 Mitgliedsstaaten die Kooperation unterzeichnet. PESCO ist also
              zu einem (fast) gesamteuropäisches Projekt geworden. In einer Zeit,
              in der Rechtspopulisten in ganz Europa das Hohelied auf den Nationalstaat
              singen, ist eine derartige Kooperation nationaler Streitkräfte auf europäischer
              Ebene ein beeindruckendes Symbol der Stärke des europäischen Projektes.</p>

              <p>BÜNDNIS 90/DIE GRÜNEN begrüßen grundsätzlich eine verstärkte Kooperation
              im Bereich der Sicherheits- und Verteidigungspolitik, insofern dadurch
              das Primat des Zivilen der europäischen Außenpolitik nicht geschwächt
              wird und es nicht zu einer Stagnation oder Reduktion notwendiger Gelder
              für die Entwicklungszusammenarbeit und die Humanitäre Hilfe kommt. Die
              Schere zwischen zivilen und militärischen Ausgaben in den nationalen
              Haushalten der EU-Mitgliedsstaaten darf nicht weiter aufgehen. Nur dadurch
              kann gewährleistet werden, dass die EU in die Lage versetzt wird, die
              in Artikel 43(1) des Vertrags von Lissabon beschriebenen Aufgaben: „Abrüstung,
              humanitäre Aufgaben, Aufgaben der Konfliktverhütung und Kampfeinsätze
              im Rahmen der Krisenbewältigung einschließlich friedenschaffender Maßnahmen
              und Operationen zur Stabilisierung der Lage nach Konflikten“ besser
              bewältigen und verstärkt nachgehen zu können.</p>

              <p>Bei einer Kooperation im Sicherheits- und Verteidigungsbereich auf
              europäischer Ebene darf es nicht nur um die Steigerung der militärischen
              Effizienz und den Abbau von Kooperationshemmnissen gehen. Ein derartiges
              Projekt darf nicht missbraucht werden, um Rüstungsausgaben zu erhöhen
              und eine ineffiziente und intransparente Rüstungsindustrie weiter zu
              subventionieren, wie es jetzt der europäische Verteidigungsfond vorsieht.
              Sondern es muss vor Allem darum gehen, dass die EU die Aufgaben des
              Vertrags von Lissabon vollumfänglich erfüllen kann. Dazu fehlen derzeit
              zivile und militärische Fähigkeiten, bspw. einsatzfähige Battle Groups,
              Mediationsteams, Technik zur Überwachung von Waffenstillstandsabkommen,
              Fähigkeiten zur Gewährleistung humanitärer Hilfe in Blockadelagen, ausgebildete
              Teams zur Dokumentation von Menschenrechtsverletzungen oder eine Strategie
              für politische Missionen zur Stabilisierung von Staaten in Nachkriegssituationen.
              An der Frage, ob es gelingt hier vorwärts zu kommen, müssen sich aktuelle
              und kommende Kooperationsprojekte messen lassen. Eine Vertiefung der
              Zusammenarbeit im Verteidigungsbereich darf nicht dazu führen, dass
              zivile Gelder sicherheitspolitisch zweckentfremdet werden, wie es u.a.
              durch die Öffnung des Instruments für Stabilität und Frieden (IcSP)
              für militärische Zwecke zu befürchten ist. Darüber hinaus darf die vertiefte
              Integration der Verteidigungspolitik nicht dazu genutzt werden, Maßnahmen
              zur Migrationsabwehr, bzw. eine europäische Abschottungspolitik voranzutreiben.
              Zudem muss die finanzielle Trennschärfe von entwicklungspolitischen
              und militärischen Maßnahmen zu jeder Zeit gegeben sein.</p>

              <p>Für BÜNDNIS 90/DIE GRÜNEN ist klar: Eine Zusammenarbeit auf europäischer
              Ebene muss immer strategisch auf eine präventive, auf friedliche Konfliktlösung
              gerichtete und menschenrechtsgeleitete Außenpolitik ausgerichtet bleiben.
              Eine verstärkte Kooperation im Verteidigungsbereich muss der EU die
              entsprechenden Mittel zu ihrer Umsetzung an die Hand geben. Es braucht
              nicht mehr nationale Aufrüstung der jeweiligen EU-Mitgliedstaaten, sondern
              mehr Kooperation. Eine regelmäßige Erhöhung der nationalen Verteidigungsausgaben,
              wie sie im Ratsbeschluss zur Einsetzung der PESCO verpflichtend festgeschrieben
              ist, lehnen wir ab. Deswegen wollen wir Grünen die zunehmende Kooperation
              im Verteidigungsbereich kritisch begleiten, mitgestalten und uns dafür
              einsetzen,</p>

              <ul>

              <li>dass die längst fällige Debatte um die strategische Ausrichtung
              der europäischen Sicherheits- und Verteidigungspolitik endlich nachgeholt
              und in Anlehnung an nationale Weißbuchprozesse geführt wird; öffentlich,
              engagiert , entlang konkreter Szenarien und begleitet von Debatten in
              den nationalen und dem europäischen Parlament,</li>

              </ul>

              <ul>

              <li>dass Diplomatie, Prävention, Mediation, Dialog und Versöhnung weiterhin
              das Fundament und den Ausgangspunkt europäischer Außen- und Sicherheitspolitik
              bilden und diese Maßnahmen weiter gefördert werden,</li>

              </ul>

              <ul>

              <li>dass Militär immer nur als äußerstes Mittel eingesetzt wird. Alle
              Einsätze müssen völkerrechts- und grundgesetzkonform sein, das heißt
              nicht in verfassungswidrigen Koalitionen der Willigen stattfinden. Die
              Beteiligung der Bundeswehr an bewaffneten Einsätzen im Rahmen der EU
              darf nur mit einem Mandat der Vereinten Nationen erfolgen. Einsätze
              müssen immer in eine umfassende zivile Gesamtstrategie eingebettet sein.
              VN-geführte Missionen haben für uns immer Vorrang vor EU- oder NATO-geführten
              Einsätzen.</li>

              </ul>

              <ul>

              <li>dass Synergien zwischen den Mitgliedsstaaten genutzt werden, um
              nationale Verteidigungsausgaben einzusparen und damit Verteidigungsprojekte
              nicht den europäischen Haushalt belasten,</li>

              </ul>

              <ul>

              <li>dass die ineffiziente und intransparente europäische Rüstungsindustrie
              grundlegend neu strukturiert und reformiert wird sowie eine restriktivere
              und verbindliche Rüstungsexportpolitik in der EU und Deutschland gesetzlich
              verankert wird.</li>

              </ul>

              <ul>

              <li>dass die Entscheidung über die Entwicklung konkreter Fähigkeiten
              mit Hinblick auf die VN-fähigkeit der EU geschieht und das Verhältnis
              von NATO und EU bei der Entwicklung der europäischen Verteidigungszusammenarbeit
              geklärt wird,</li>

              </ul>

              <ul>

              <li>dass die zunehmende Kooperation im Verteidigungsbereich mit einer
              Stärkung von Strukturen der parlamentarischen Kontrolle und Mitbestimmung
              insbesondere auf europäischer Ebene einhergeht. Der Parlamentsvorbehalt
              des Bundestags oder langfristig der des Europäischen Parlamentes darf
              durch die europäische Kooperation weder unterlaufen noch abgebaut werden
              und dass</li>

              </ul>

              <ul>

              <li>Maßnahmen zur Kohärenzförderung zwischen verschiedenen Politikfelder
              wie Energiepolitik, Entwicklungspolitik, oder Handelspolitik, entwickelt
              werden.</li>

              </ul>

              <p>Die zunehmende Kooperation der europäischen Mitgliedsländer im Verteidigungsbereich
              ist eine einmalige Chance, das Friedensprojekt Europa zu stärken. Sie
              setzt ein deutliches Zeichen gegen wachsenden Nationalismus und Nationalstolz.
              BÜNDNIS 90/DIE GRÜNEN werden diesen Prozess aktiv und im Sinne des Vertrags
              von Lissabon mitgestalten. So wird die Europäische Union der Verantwortung,
              die aus der Annahme des Friedensnobelpreises erwächst, ein Stück gerechter.</p></div>'
