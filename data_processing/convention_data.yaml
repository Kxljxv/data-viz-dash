    - '552':
        type: motion
        id: 552
        agenda_item: Haushalt
        prefix: H-05 Beschluss
        title: Beiträge der Mandatsträger*innen an den Bundesverband
        title_with_intro: Beiträge der Mandatsträger*innen an den Bundesverband
        title_with_prefix: 'H-05 Beschluss: Beiträge der Mandatsträger*innen an den
          Bundesverband'
        status_id: 3
        status_title: Eingereicht
        date_published: null
        supporters: []
        initiators:
          type: null
          name: null
          organization: null
        initiators_html: 'Bundesdelegiertenkonferenz (beschlossen am: 27.01.2018)'
        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p>Die Bundespartei
              macht von ihrem durch das Parteiengesetz formulierten und in der Bundessatzung
              hinterlegten Recht Gebrauch, Mandatsträger*innen-Beiträge von ihren
              Mandatsträger*innen und Inhaber*innen von Regierungsämtern auf Bundes-
              und Europaebene zu erheben.</p>

              <ol><li>Mandatsträger*innen-Beiträge werden von den Abgeordneten des
              Deutschen Bundestages und des Europaparlaments, von Mitgliedern der
              Regierung der Bundesrepublik Deutschland und EU-Kommissar*innen, von
              Parlamen-tarischen Staatssekretär*innen und Staatssekretär*innen sowie
              Präsi-dent*innen und Vizepräsident*innen des Deutschen Bundestages bzw.
              des EU-Parlamentes erhoben.</li>

              <li>Bemessungsgrundlage für die Ermittlung der Mandatsträger*innen-Beiträge
              sind die jeweiligen Diäten, die Abgeordnetenentschädigungen bzw. Besoldungsbeträge.</li>

              <li>Die Höhe des Mandatsträger*innen-Beitrages beträgt grundsätzlich
              19% der Bemessungsgrundlage.</li>

              <li>Je kindergeld-berechtigendem Kind können 250,00 € pro Monate in
              Abzug gebracht werden.</li>

              <li>Unterhaltsverpflichtungen bzw. tatsächliche Unterhaltsleistungen
              können ebenfalls abgezogen werden. Darüber entscheidet bei Bundestags-abgeordneten
              der/die Bundesschatzmeister*in mit einem Mitglied des geschäftsführenden
              Fraktionsvorstandes, bei Europaabgeordneten der/die Bundesschatzmeister*in
              mit einer/m Vertreter*in der Europagruppe DIE GRÜNEN. Für andere Beitragsverpflichtete
              gilt diese Zuständigkeitsregelung entsprechend.</li>

              <li>Ist eine beitragspflichtige Person gleichzeitig Mitglied des Bundesvorstandes
              von BÜNDNIS 90/ DIE GRÜNEN, bezieht sie nach der Finanzordnung des Bundesvorstandes
              keine Vergütung von der Partei. Als Ausgleich für die Doppelbelastung
              werden in diesen Fällen keine Mandatsträger*innen-Beiträge erhoben.</li>

              <li>Die endgültige Höhe der abzuführenden Beiträge ergibt sich nach
              Berücksichtigung der Regelungen der Absätze 3) bis 6).</li>

              <li>Die Erhebung der Beträge nach Absatz 7) erfolgt grundsätzlich durch
              die Bundespartei. Davon ausgenommen sind die Beiträge der Mitglieder
              des Deutschen Bundestages (MdB). Diese werden von den jeweiligen Landes-verbänden
              von BÜNDNIS 90/DIE GRÜNEN erhoben.</li>

              <li>Von den Beiträgen der MdB nach Absatz 7), die an die Landesverbände
              abgeführt werden, erhält die Bundespartei 73 % pro MdB und Monat. Dies
              gilt nur für MdBs ohne Regierungsamt.</li>

              </ol></div>'
            layout_right: false
        - Begründung:
            type: TextSimple
            title: Begründung
            html: ''
