        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: "<div class=\"text motionTextFormattings textOrig\"><ol><li>Der\
              \ 2010 durch BDK-Beschluss eingerichtete Fonds zur Unterstützung von\
              \ Wahlkämpfen und Volksentscheiden („Solifonds“) hat sich bewährt und\
              \ wird weitergeführt.</li>\n<li>Der Solifonds speist sich aus einem\
              \ Anteil von 2% an den staatlichen Mitteln, die vom Bundesverband an\
              \ die Landesverbände ausgeschüttet werden.</li>\n<li>Die Verwaltung\
              \ des Solifonds erfolgt durch das in der Satzung dafür vorgesehene Gremium;\
              \ es wird ein jährlicher Bericht über die Verwendung der Mittel vorgelegt.</li>\n\
              <li>Der Fonds wird vom Bundesverband buchhalterisch verwaltet und als\
              \ eigener Posten in seinem Jahresabschluss ausgewiesen. Dies gilt für\
              \ alle Zweige dieses Fonds (zur Zeit: Weiterbildungsfonds).</li>\n<li>Anträge\
              \ für die Unterstützung können von Landesverbänden und dem Bundesverband\
              \ in folgenden Fällen gestellt werden:\n<ol><li>für Wahlkämpfe von Landesverbänden\
              \ ohne Landtagsfraktion</li>\n <li>für Wahlkämpfe von anderen Landesverbänden\
              \ in begründen Ausnahmenfällen</li>\n <li>für Volksentscheide auf Landesebene,\
              \ wenn diese eine hinreichende Erfolgsaussicht und eine bundesweite\
              \ Bedeutung haben</li>\n <li>zur einmaligen Unterstützung beim Erhalt\
              \ wichtiger Strukturen in Landesverbänden ohne Landtagsfraktion</li>\n\
              \ <li>zur einmaligen Finanzierung oder Co-Finanzierung von Projekten,\
              \ die der Partei zur Vorbereitung und Unterstützung in Wahlkämpfen dienen.</li>\n\
              </ol></li>\n<li>\n<p>Das in der Satzung dafür vorgesehene Gremium entscheidet\
              \ über Anträge nach Vorlage einer aktuellen mittelfristigen Finanzplanung\
              \ inklusive (Wahlkampf-)Haushaltsplanung der zu unterstützenden Gliederung.</p>\n\
              </li>\n<li>\n<p>Das in der Satzung dafür vorgesehene Gremium entscheidet,\
              \ ob und in welcher Höhe ein Teil der Unterstützung als Darlehen gewährt\
              \ wird.</p>\n</li>\n<li>\n<p>Der Solifonds, sowie seine Verwaltungs-\
              \ und Vergabeverfahren werden nach fünf Jahren evaluiert und für die\
              \ BDK ausgewertet.</p>\n</li>\n<li>\n<p>Aus diesem Solifonds sollen\
              \ wie von der BDK 2014 beschlossen weiterhin jährlich 85.000 Euro in\
              \ den Weiterbildungsfonds zugeführt werden. Zur Aufteilung und Kontrolle\
              \ dieser Mittel ist das in der Satzung dafür vorgesehene Gremium zuständig.</p>\n\
              </li>\n<li>\n<p>Der Bundesfinanzrat wird beauftragt, den Verteilungsschlüssel\
              \ für die staatliche Grundfinanzierung zwischen Bundesverband und Landesverbänden\
              \ sowie zwischen den Landesverbänden bis zur BDK 2019 zu evaluieren\
              \ und so ausrichten, dass überall auf Landesebene die Finanzierung einer\
              \ Grundstruktur möglich ist. Die regelmäßigen Anträge von Ost-Landesverbänden\
              \ an den Solifonds deuten darauf hin, dass es hier strukturelle Probleme\
              \ gibt, die zügig angegangen werden sollten.</p>\n</li>\n</ol></div>"
            layout_right: false
