            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p>Mehr als zwei
              Jahren haben wir Grüne Seite an Seite mit vielen zivilgesellschaftlichen
              Organisationen und engagierten Bürgern gegen die erneute Wiederzulassung
              von Glyphosat gekämpft. Am 27. November 2017 hat Noch-Landwirtschaftsminister
              Christian Schmidt (CSU) mit seiner eigenmächtigen Zustimmung Deutschlands
              dafür gesorgt, dass der weltweit und am häufigsten verwendete Pestizid-Wirkstoff
              fünf weitere Jahre auf Europas Äckern versprüht werden darf. Das ist
              zweifellos ein Skandal. Dennoch haben wir in den Auseinandersetzungen
              um den Wiederzulassungsprozess des Ackergiftes politisch viel erreicht.</p>

              <p>Millionen Menschen in Deutschland und ganz Europa haben Petitionen
              unterschrieben, sich an Aktionen beteiligt, Fragen gestellt und sich
              mit dem Selbstbild einer Landwirtschaft auseinandergesetzt, die das
              Versprühen von Gift auf künftigen Lebens- und Futtermitteln für eine
              nicht zu kritisierende Selbstverständlichkeit hält.</p>

              <p>Die „Causa Glyphosat“ hat vielen Menschen zudem deutlich gemacht,
              in welch erheblichem Maße die Bundesregierung und ihre Behörden Einfluss
              auf europapolitische Entscheidungen nehmen oder selbst zu verantworten
              haben.</p>

              <p>All das ist uns Grünen Ansporn, jetzt erst recht dranzubleiben und
              konkrete Ausstiegspläne für Glyphosat und besonders problematische Pestizide
              einzufordern. Dazu zählen das vollständige Verbot aller Neonikotinoide,
              die Insekten, Vögel und Kleinlebewesen nachweislich besonders schwer
              schädigen, sowie von Pestiziden mit hormonschädigenden Eigenschaften.</p>

              <p>Auf diesem Weg haben wir bereits viel erreicht: Trotz erneuter Genehmigung
              wurde der agrochemische Kassenschlager Glyphosat nur für fünf statt
              der ursprünglich geplanten fünfzehn Jahre zugelassen. Auf Initiative
              der Grünen hat das Europaparlament einen Ausstiegsbeschluss bis Ende
              2022 gefasst, der, wären EU-Kommission und Mitgliedsstaaten dieser Vorlage
              gefolgt, erneute Risikobewertung gänzlich überflüssig gemacht hätte.
              Mit dem jetzigen Beschluss sind zähe Auseinandersetzung über eine erneute
              Zulassung in fünf Jahren vorprogrammiert. Auf Grundlage einer UN-Studie
              strebt unsere Fraktion im Europaparlament derzeit eine Klage gegen die
              Rechtmäßigkeit des Beschlusses und die Einsetzung eines Sonderausschusses
              an, um am Ziel eines EU-weiten Verbots festzuhalten.</p>

              <p>Die knappe, nur durch das Abstimmungsverhalten Deutschlands ermöglichte
              EU-weite Wiederzulassung zeigt: Wir haben starke Partner in anderen
              EU-Mitgliedsstaaten, die bereit sind, den Weg in eine Glyphosat-freie
              Zukunft mitzugehen und eine Abkehr von dem beständig steigenden Pestizid-Einsatz
              auf Europas Äckern einzustehen. Auch die EU-Kommission steht mit ihrem
              Versprechen einer „pestizidfreien Zukunft“ vom 12. Dezember 2017 gegenüber
              der Europäischen Bürgerinitiative „Stopp Glyphosat“ im Wort.</p>

              <p>Diesen Weg gilt es jetzt mit einem nationalen Verbote einzuschlagen.
              Frankreich und Österreich haben das bereits angekündigt. Auch in Deutschland
              wollen wir ein solches Verbot erreichen. Die neue Bundesregierung wird
              sich gegenüber ihren Wählerinnen und Wähler an der Frage messen lassen
              müssen, ob auch sie dazu bereit ist. Als Grüne werden wir alles daran
              setzen, sie in diese Verantwortung zu zwingen.</p>

              <p>Das massive Insektensterben duldet keinen Aufschub. Es gibt zahlreiche
              Studien, die die industrielle Landwirtschaft als wesentlichen Treiber
              dieser Entwicklung ansehen. Seit 1980 sind in Deutschland fünfundsiebzig
              Prozent aller Insekten- und rund die Hälfte aller Vogelbestände auf
              landwirtschaftlichen Flächen verschwunden. Eine Landwirtschaft, die
              ihre natürlichen Ressourcen in solcher Art und Weise schädigt, ist nicht
              zukunftsfähig. Unser Boden, unser Wasser und unsere Luft sind unersetzliche
              gemeinschaftliche Güter, die zu schützen jede Regierung verpflichtet
              ist.</p>

              <p>Deshalb fordern wir von der künftigen Bundesregierung,</p>

              <ul>

              <li>ihre nationalen Möglichkeiten für rechtsfeste Verbote und Auflagen
              zu nutzen, um besonders problematische Pestizide wie Glyphosat zügig
              vom Markt zu nehmen bzw. in ihrer Anwendung wirksam zu beschränken.</li>

              </ul>

              <ul>

              <li>sich auf europäischer für eine Reform der Risikobewertung und Zulassungsverfahren
              für Pestizide einzusetzen. Diese müssen transparent, unabhängig von
              Industrieeinflussnahme und alle Risiken umfassend erfolgen.</li>

              </ul>

              <ul>

              <li>dem auf März 2018 verschobenen Verbotsvorschlag der EU-Kommission
              für drei Neonikotinoiden zuzustimmen und für eine Ausweitung des Verbots
              auf die gesamte Wirkstoffe-Gruppe einzutreten.</li>

              </ul>

              <ul>

              <li>in den 2018 anstehenden Reformen der EU-Pestizid-Gesetzgebung und
              Gemeinsamen Agrarpolitik (GAP) für starke Zielvorgaben und Instrumente
              zur Pestizid-Reduktion, eine Bindung von Subventionen an ökologische
              Leistungen und zur Förderung der Artenvielfalt einzusetzen.</li>

              </ul>

              <ul>

              <li>ein umfassendes Monitoring-Programm über die Auswirkungen von Pestiziden
              auf die Umwelt, Artenvielfalt und Gesundheit von Mensch und Tier aufzulegen.</li>

              </ul>

              <ul>

              <li>die am 13. Dezember 2017 auf EU-Ebene beschlossenen Kriterien zum
              Verbot hormonschädigender Pestizide national streng auszulegen und sich
              auf EU-Ebene für die Ausarbeitung geeigneter Leitlinien zur Identifizierung
              dieser Stoffe einzusetzen, die dem Schutz von Mensch und Umwelt gerecht
              werden.</li>

              </ul>

              <ul>

              <li>Investitionen in Forschung und unabhängige Beratungsstrukturen zu
              tätigen, um Landwirte in der Umstellung auf Chemie-freie Anbaumethoden
              zu unterstützen.</li>

              </ul>

              <ul>

              <li>Den Nationalen Aktionsplan Pflanzenschutz endlich als Instrument
              zur Minderung von Pestizidmengen, und dem Ausbau des nicht-chemischen
              Pflanzenschutzes zu nutzen.</li>

              </ul>

              <ul>

              <li>den Ausbau des Ökolandbaus als Pestizid-freie und nachhaltigste
              Form der Landwirtschaft mit einem Förderprogramm im Umfang von einer
              Milliarde Euro über die nächsten sieben Jahre zu beschleunigen.</li>

              </ul></div>'
            layout_right: false
        - Begründung:
            type: TextSimple
            title: Begründung
            html: ''
            layout_right: false
