        id: 527
        agenda_item: Beschlüsse (vorläufig)
        prefix: S-12 Beschluss
        title: 'Umbenennung zwei weitere Mitglieder im Bundesvorstand in zwei stellvertretende
          Vorsitzende '
        title_with_intro: 'Umbenennung zwei weitere Mitglieder im Bundesvorstand in
          zwei stellvertretende Vorsitzende '
        title_with_prefix: 'S-12 Beschluss: Umbenennung zwei weitere Mitglieder im
          Bundesvorstand in zwei stellvertretende Vorsitzende '
        status_id: 3
        status_title: Eingereicht
        date_published: null
        supporters: []
        initiators:
          type: null
          name: null
          organization: null
        initiators_html: 'Bundesdelegiertenkonferenz (beschlossen am: 26.01.2018)'
        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p>Änderung der
              Satzung §15 (2)</p>

              <p>ersetze: „4. zwei weitere Mitglieder.“</p>

              <p>durch: „4. zwei stellvertretende Vorsitzende.“</p></div>'
            layout_right: false
        - Begründung:
            type: TextSimple
            title: Begründung
            html: '<div class="text motionTextFormattings textOrig"><p>Der Bundesvorstand
              besteht aus sechs mit gleichem Stimmrecht ausgestatteten Mitgliedern.
              Denn wir leisten uns als Partei richtigerweise einen hauptamtlichen
              Bundesvorstand, in dem jedes Vorstandsmitglied auch eigene Mitarbeiter*innen
              hat. Der Bundesvorstand soll die Interessen der Partei in der Öffentlichkeit
              vertreten wie auch gegenüber der Bundestags- und Europafraktion und
              den Ländern. Als Partei haben wir ein Interesse an einem starken und
              arbeitsfähigen Bundesvorstand. Insbesondere die unklare öffentliche
              Wahrnehmung der zwei „weiteren Mitglieder“ im Bundesvorstand, nutzt
              nicht die Möglichkeiten diese zwei Bundesvorstandsmitglieder im Interesse
              des gesamten Bundesvorstandes aber auch der Gesamtpartei optimal einzusetzen.
              Dienen in anderen Parteien die „einfachen“ Bundesvorstandsmitglieder
              vor allem dem Regionalproporz und Einbindung spezieller Interessengruppen,
              sind und waren sie im Grünen Bundesvorstand immer integraler Bestandteil
              der inhaltlichen Partei- und Vorstandsarbeit. Durch die Übernahme spezieller
              Verantwortlichkeiten wie die „frauenpolitische Sprecherin“ oder als
              „europäische und internationale Koordinator*in“ wie auch diverser inhaltlicher
              Schwerpunktsetzungen, tragen und trugen sie zur Profilbildung unserer
              Partei bei.</p>

              <p>Durch die Umbenennung dieser Position in stellvertretende Vorsitzende,
              soll einerseits die wichtige Arbeit die von ihnen geleistet wird und
              wurde eine Anerkennung erhalten und andererseits die Rolle in der öffentlichen
              Wahrnehmung gestärkt werden. Sie stehen von der Verantwortung und Einbindung
              in die Arbeits- und Entscheidungsprozesse mindestens auf einer Stufe
              mit den stellvertretenden Vorsitzenden der anderen im Bundestag vertretenen
              Parteien. Andererseits soll die Umbenennung auch eine bessere Arbeits-
              und Lastenverteilung im Bundesvorstand ermöglichen. Nicht nur im Sinne
              der Vereinbarkeit von Familie und Beruf, die es ermöglichen muss, Arbeitsbelastungen
              besser in einem Team wie dem Bundesvorstand zu verteilen, sondern auch
              um die politische Präsenz unserer Partei gegenüber anderen Organisationen,
              bei Demonstrationen, in der Bündnisarbeit und bei öffentlichen Veranstaltungen
              zu verbessern.</p></div>'
            layout_right: false
        proposed_procedure: null
        ammendments: []
