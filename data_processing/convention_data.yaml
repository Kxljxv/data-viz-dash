            html: '<div class="text motionTextFormattings textOrig"><p>Die Bundestagsfraktion
              Bündnis 90/DIE GRÜNEN wird aufgefordert, eine Gesetzesinitiative für
              eine Wahlrechtsreform zu ergreifen: Niemand darf im Zusammenhang mit
              einer Behinderung vom Wahlrecht ausgeschlossen werden. Die Ausschlusstatbestände
              gemäß § 13 Nummer 2 und 3 Bundeswahlgesetz sowie gemäß § 6a Europawahlgesetz
