        initiators_html: 'Bundesdelegiertenkonferenz (beschlossen am: 26.01.2018)'
        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p>Die Erfahrung
              der letzten Wochen zeigt, wie wichtig eine engagierte, kontinuierliche
              und beharrliche grüne Politik ist. Durch den Wahlkampf und die anschließenden
              Jamaika-Sondierungsgespräche ist es uns gelungen, Klimaschutz und einer
              ökologisch-sozialen Politik einen hohen Stellenwert zu geben. Doch die
              sich abzeichnende Große Koalition versagt beim Klimaschutz. Jetzt ist
              es unsere Aufgabe, der Großen Koalition eine progressive grüne Politik
              entgegen zu stellen und unseren Themen mit Visionen und Konzepten Einfluss
              und Geltung zu verschaffen.</p>

              <p>Schon mit bündnisgrüner Regierungsbeteiligung wäre es sehr schwierig
              geworden, die deutschen Klimaziele zu erreichen. Ohne uns sind sie faktisch
              verloren. Denn alle anderen politischen Kräfte scheuen konkrete Vorschläge
              wie einen schnellen Kohleausstieg, eine emissionsfreie Mobilität oder
              klimaneutrale Städte. Und auch in vielen anderen Bereichen gilt: Grün
              macht den Unterschied. Wenn es um eine starke weltoffene Gesellschaft
              geht, in der wir Integration fördern, Einwanderung als Chance verstehen
              und die sich durch eine humane und rechtsstaatliche Flüchtlingspolitik
              auszeichnet. Wie wir eine menschenrechtsbasierte Außenpolitik verwirklichen
              können, die die Globalisierung gerecht gestaltet, Fluchtursachen bekämpft
              und auf eine faire Handelspolitik setzt. Bei der Aufgabe, den Zusammenhalt
              eines starken und vereinten Europas zu sichern. Dabei, wie eine gerechte
              Verteilung zwischen starken und schwachen Schultern aussieht, wie die
              skandalöse Kinderarmut in unserem vermögenden Land beendet und gerechte
              Bildungschancen für alle Kinder – egal aus welchem Elternhaus – erreicht
              werden können. Dabei, die Folgen der Digitalisierung ökologisch, sozial
              und demokratisch zu gestalten, indem wir Freiheitsrechte stärken und
              uns für Arbeitnehmer*innen einsetzen. Und nicht zuletzt dabei, wie wir
              die sozialen Sicherungssysteme fit für die Zukunft machen, die Zweiklassenmedizin
              abschaffen, Altersarmut beenden und zu gleichen Rechten und Möglichkeiten
              für Alle kommen – überall sind unsere Antworten gefordert wie nie.</p>

              <p>Und auch das haben die Sondierungen gezeigt: Es kann keine Rede davon
              sein, dass alle Parteien mehr oder weniger gleich sind. Die Unterschiede
              zwischen den Parteien in wichtigen Feldern sind teilweise tiefgreifend.
              Es ist ein großer Gewinn für unsere Demokratie, wenn diese Unterschiede
              zum Ausdruck kommen. Es gibt wahrhaft keinen Grund für Verdruss an der
              Demokratie. Meinungsstreit und Wertekonkurrenz sind so lebendig wie
              selten. Unser Anspruch ist es, langfristige Visionen und konkretes Handeln
              zusammenzubringen, um unsere Zukunft zu gestalten. Wir wollen Verantwortung
              für gesellschaftlichen Fortschritt übernehmen. Dafür ist unser Maßstab
              im Handeln: Wie können wir das Leben der Menschen heute und in Zukunft
              konkret verbessern und unsere Lebensgrundlagen schützen? Als progressive
              Kraft der linken Mitte haben wir den Anspruch, die Debatten in diesem
              Land, in Europa und weltweit in diesem Sinne voranzutreiben. Wir wollen
              den Menschen in Zeiten der Verunsicherung Orientierung bieten, mögliche
              Weichenstellungen aufzeigen. Wir setzen auf ein starkes Gemeinwesen
              als Rahmen, in dem sich Einzelinteressen entfalten. Wir schützen unseren
              Planeten. Wir schauen nicht nur auf Deutschland, sondern haben Europa
              und die ganze Welt im Blick.</p>

              <p>Es muss auch und gerade unsere Aufgabe sein, Orientierung und Halt
              zu geben, um dem Erstarken der antidemokratischen Kräfte und autoritären
              Tendenzen entgegenzuwirken. Indem wir daran arbeiten, dass unsere Gesellschaft
              durch Solidarität und Zusammenhalt gewinnt, statt dass sie durch Ausgrenzung
              und gnadenlosen Wettbewerb verliert. Durch eine Vielfalt an spannenden
              politischen Alternativen. Und nicht zuletzt durch ein starkes grünes
              Angebot. Wie auch immer sich der politische Prozess in diesem Land weitergestalten
              wird, wir stehen bereit, ihm einen starken grünen Stempel aufzudrücken.
              Egal ob aus der Opposition, in Regierungsverantwortung, bei einer Minderheitsregierung
              oder auch, falls es zu Neuwahlen kommen sollte: Wir werden entschieden
              für unsere Inhalte eintreten. Wir Grünen werden in den Ländern und Kommunen,
              im Bund und in Europa für die grüne Sache kämpfen – mit unseren Mitgliedern,
              mit unseren Abgeordneten und Regierungsmitgliedern, mit Unterstützer*innen
              in allen gesellschaftlichen Bereichen.</p>

              <p>Wir bleiben eine Partei in Bewegung. Wir werden weiterhin den engen
              Schulterschluss mit unseren Bündnispartner*innen suchen und noch intensivieren.
              Die sich abzeichnenden ökologischen Katastrophen im Klimabereich oder
              beim Artensterben, aber auch die Umsetzung einer humanitären Flüchtlingspolitik
              und die Verringerung der sozialen Spaltung in diesem Land brauchen Druck
              im Parlament und durch die Zivilgesellschaft. Für unsere Positionen
              werben wir auf der Straße und im Netz gemeinsam mit vielen anderen,
              die für die gleichen Ziele streiten. Wir setzen auf Bündnisse mit den
              Umweltverbänden, mit den vielen - oft ehrenamtlichen - Flüchtlingshelfer*innen,
              mit den fortschrittlichen Gewerkschaften und Unternehmen, die erkannt
              haben, dass eine Wirtschaft auf Kosten der Umwelt keine Zukunft hat,
              mit Menschen, die sich für eine gerechte Welt einsetzen, die Menschenrechte,
              Gleichberechtigung und Rechtsstaatlichkeit hoch halten, die Nazis und
              Rassist*innen die rote Karte zeigen, die sich für gleiche Rechte von
              allen Menschen, egal welchen Geschlechts, einsetzen und sich für die
              körperliche und sexuelle Selbstbestimmung von Frauen stark machen. Darüber
              hinaus sind wir als Partei Ansprechpartnerin für alle, die gemeinsam
              mit uns die ökologisch-soziale Modernisierung vorantreiben und unser
              Land innovativer und kreativer machen wollen. Wir haben in den letzten
              beiden Jahren einen deutlichen Mitgliederzuwachs verzeichnet und sind
              so viele Grüne wie noch nie. Gemeinsam können wir der Politikverdrossenheit
              entgegenwirken und so noch mehr Menschen für Grün begeistern.</p>

              <p>Auch wenn die Bundesregierung noch nicht gebildet ist, dreht sich
              die Welt weiter. Im Bundestag stehen wichtige Entscheidungen an. Im
              März 2018 läuft endlich die Aussetzung des Familiennachzugs für subsidiär
              Geschützte aus. Diese Aussetzung des Familiennachzugs widerspricht nicht
              nur dem Schutz der Familie im Grundgesetz und humanitären Grundwerten,
              sondern sie steht einer gelingenden Integration im Wege. Eine Trennung
              von Müttern, Vätern und ihren Kindern über den März 2018 hinaus wird
              von uns Grünen keine Zustimmung erhalten. Wir werden mit einem breiten
              gesellschaftlichen Bündnis die gesellschaftliche Mehrheit für den Familiennachzug
              in eine politische Mehrheit übersetzen und die Regelung auslaufen lassen.
              Wir streiten für eine menschenrechtsorientierte Flüchtlingspolitik,
              Rechtsstaatlichkeit und das uneingeschränkte Grundrecht auf Asyl, also
              ohne eine Obergrenze und ohne Asylrechtsverschärfungen. Unseren Ansatz
              einer humanen Asylpolitik wollen wir mit einer progressiven Einwanderungspolitik
              ergänzen, die nicht nur Hochqualifizierten offen steht, sondern auch
              Geflüchteten oder geringer qualifizierten Menschen Chancen für langfristige
              oder temporäre Arbeits- und Bildungsmigration bieten.</p>

              <p>Nach dem unverantwortlichen Alleingang von CSU-Landwirtschaftsminister
              Schmidt in Brüssel geht es uns jetzt darum, in den Bundesländern und
              Kommunen aktiv zu werden und die Nutzung vom Glyphosat und anderen gesundheits-
              und umweltschädlichen Pestiziden zu unterbinden. Auch wenn nationales
              Handeln nur der zweitbeste Weg ist, müssen wir jetzt in Deutschland
              den Glyphosatausstieg einleiten, so wie es andere europäische Länder
              bereits angekündigt haben. Wir brauchen Anwendungsverbote von Glyphosat
              beispielsweise auf öffentlichen Grünanlagen auf Spielplätzen und Bahnflächen.
              Doch das Hauptproblem ist der massive Glyphosateinsatz auf den Äckern.
              Unser Ziel ist den Glyphosateinsatz deutlich zu reduzieren und nach
              einer Übergangszeit mit den Landwirt*innen ganz auf umweltfreundliche
              Alternativen umzusteigen. Für uns zählt jeder Acker, jede Kommune, jeder
              Grünstreifen in jedem Bundesland: Wir werden gegen Gift kämpfen, damit
              Verbraucher*innen pestizidfreie Lebensmittel auf dem Teller haben und
              dem Artensterben Einhalt geboten werden kann.</p>

              <p><strong>Kommende Aufgaben</strong></p>

              <p><strong>Wahlergebnis weiter auswerten</strong></p>

              <p>Wir haben damit begonnen, unser grünes Wahlergebnis mit vielen Aktiven
              auszuwerten. Das werden wir fortsetzen und daraus für kommende Wahlen
              Konsequenzen ziehen. Dabei reflektieren wir, warum wir als Grüne trotz
              eines engagierten Wahlkampfes unsere Ziele nicht erreichen konnten.
              Die Erfahrungen aus dem Programmprozess zur Bundestagswahl werden wir
              bei der Erarbeitung des Europawahl- und des Grundsatzprogrammes berücksichtigen.
              Die Einbindung von Fachgremien und -politiker*innen in die Programmprozesse
              wollen wir weiter verbessern. Die Urwahl der Spitzenkandidat*innen wollen
              wir technisch fortentwickeln und einen Vorschlag entwickeln, wie auch
              bei einer Urwahl mit mehreren Kandidat*innen die Wahlentscheidung mit
              mehr als der Hälfte der abgegebenen Stimmen erfolgen kann.</p>

              <p><strong>Bündnisgrün in den Ländern stärken</strong></p>

              <p>In den kommenden Jahren stehen wichtige Wahlen an. 2018 werden die
              Landtage in Bayern und Hessen gewählt. Unsere Freund*innen in den wahlkämpfenden
              Landesverbänden werden wir als Gesamtpartei mit aller Kraft unterstützen.
              Denn es geht um viel. In Bayern wollen wir einen kraftvollen, eigenen
              Gestaltungsanspruch erheben. Unser Ziel ist es, erstmals in Bayern ein
              gutes, zweistelliges Ergebnis zu erreichen und unsere grünen Ideen in
              Regierungsverantwortung umzusetzen. Wir werden die CSU deutlich in ihre
              Schranken weisen und sie inhaltlich stellen - in der Integrationspolitik,
              beim maßlosen Flächenverbrauch und der damit einhergehenden Zerstörung
              der Natur und zeigen, wie es besser geht.‎ Die CSU ist nicht Bayern.
              Unser grünes Bayern ist Heimat, die nicht ausgrenzt, zu der alle dazu
              gehören und gebraucht werden. Die Menschen in Bayern haben die ewige
              Quertreiberei der CSU in der Bundespolitik satt.‎ In Hessen wollen wir
              als eine starke eigenständige Gestaltungskraft in die Wahlauseinandersetzung
              gehen. Mit einem starken Ergebnis haben wir die Chance, Teil einer Landesregierung
              zu bleiben. Wir haben die Richtung der Politik in Hessen geändert und
              wir sind noch nicht am Ziel. Unser Motto lautet: „Grün wirkt weiter
              - #Hessen 2025“. Hessen soll weiter grüner und gerechter werden und
              weltoffen bleiben.</p>

              <p><strong>Bündnisgrüne als gesamtdeutsche Partei</strong></p>

              <p>2019 stehen die Landtagswahlen von Sachsen, Brandenburg und Thüringen
              an, dazu kommen Kommunalwahlen im Frühjahr 2019 in allen fünf ostdeutschen
              Bundesländern. Viele Menschen vertrauen auf uns Bündnisgrüne in den
              Parlamenten, als Verbündete für ihre Anliegen und darauf, gemeinsam
              für eine ökologische, soziale und demokratische Gesellschaft einzutreten.
              2019 werden wir alles geben, damit wir auch weiterhin erfolgreich aus
              den ostdeutschen Kommunalparlamenten und den Landtagen von Sachsen,
              Brandenburg und Thüringen heraus die progressive Zivilgesellschaft stützen
              können, und wir wollen unseren Charakter als gesamtdeutsche Partei verteidigen.
              Daher begreifen wir die Unterstützung der ostdeutschen Landesverbände
              als zentrale Aufgabe der Partei. Gemeinsam mit den Landesverbänden werden
              wir frühzeitig diese Wahlen auf Grundlage der Analyse der ostdeutschen
              Bundestagswahlergebnisse vorbereiten. Das bedeutet vor allem auch, die
              bündnisgrünen Strukturen in diesen Bundesländern personell wie organisatorisch
              zu stärken, damit wir bei den anstehenden Wahlen und darüber hinaus
              zulegen und uns entschieden für die bündnisgrüne Sache einsetzen können.</p>

              <p><strong>Europawahl vorbereiten</strong></p>

              <p>Wir bereiten uns intensiv auf die Europawahl im Frühjahr 2019 vor.
              Diese Wahl wird entscheidend sein, wie sich die EU in den kommenden
              Jahren entwickeln wird. Wir Grüne bekennen uns klar zur Europäischen
              Union und wollen die europäische Idee stärken und demokratisch fortentwickeln.
              Dazu gehört für uns die Diskussion über die Vorschläge von Frankreichs
              Präsident Macron. Wir wollen nicht zulassen, dass der Brexit die verbliebenen
              Mitglieder der EU auseinandertreibt. Wir schlagen ein sozial-ökologisches
              Modernisierungsprojekt für Europa vor, weg von Austerität hin zu mehr
              Investitionen und Reformen. Wir stehen für eine starke EU, die auch
              in Zeiten von Globalisierung und Digitalisierung soziale und ökologische
              Rechte setzen kann. Wir stellen uns Rechtspopulist*innen, völkischen
              Nationalist*innen und Europafeind*innen entgegen. Diesen bieten wir
              die Stirn und setzen auf eine bessere EU, die Umwelt- und Klimaschutz,
              den Abbau sozialer Ungleichheit, Demokratie und Rechtstaatlichkeit,
              Freiheit und Frieden, Humanität, Solidarität und Weltoffenheit ins Zentrum
              stellt. Unser Ziel für die Europawahl 2019 ist es, das bisher beste
              grüne Ergebnis bei bundesweiten Wahlen zu erreichen, um wieder eine
              starke und gesamteuropäische Grüne Fraktion in Brüssel zu stellen. Dafür
              werden wir auf einer BDK bis Ende 2018 ein zukunftsorientiertes Europawahlprogramm
              beschließen (mit den gleichen Antragsfristen wie bei der letzten Bundestags-
              und Europawahl) und eine schlagkräftige Liste aufstellen. Dazu wollen
              wir auf europäischer Ebene mit einem Programm der European Green Party
              und europäischen Spitzenkandidat*innen in einer grün-europäischen Kampagne
              einen klar proeuropäischen Wahlkampf führen. Wir wollen für ein besseres
              Europa kämpfen - an der Seite von progressiven Bewegungen und über die
              Landesgrenzen hinweg. Wir sind die Europapartei.</p>

              <p><strong>Demokratie stärken, Rechtsextremismus bekämpfen</strong></p>

              <p>In einem breiten Bündnis gegen Rechts stehen wir an der Seite der
              Zivilgesellschaft, mit der wir zusammen gegen Rechtsextremismus und
              für eine freiheitliche, plurale, demokratische und weltoffene Gesellschaft
              streiten. Antisemitismus in all seinen Erscheinungsformen und anderen
              Formen gruppenbezogener Menschenfeindlichkeit treten wir entschieden
              entgegen. Gewalt als Mittel der politischen Auseinandersetzung lehnen
              wir ab.</p>

              <p>Die Grüne Rechtsextremismuskommission des Bundesvorstandes wird auch
              in den kommenden Jahren zusammen mit grünen Rechtsextremismusexpert*innen
              aus Bund und Ländern, der Wissenschaft und Zivilgesellschaft Strategien
              gegen Rechts erarbeiten und evaluieren.</p>

              <p>Das Ziel der extremen Rechten ist es nicht, am demokratischen Diskurs
              teilzunehmen. Ganz im Gegenteil versuchen sie demokratische Prozesse
              grundsätzlich in Frage zu stellen mit dem Ziel, die Gesellschaft autoritär
              und völkisch zu gestalten. Dem werden wir uns an allen Orten und zu
              jeder Zeit klar entgegen stellen. Wir fordern alle Parteien zu einer
              klaren Grenzziehung zu antidemokratischen Kräften und einer Ablehnung
              rechtsextremer Rhetorik auf. Mit Schulungen, Seminaren und konkreten
              Handreichungen wollen wir unsere Mitglieder fortbilden, damit sie gruppenbezogene
              Menschenfeindlichkeit, Antisemitismus und rechtsextreme Narrative erkennen
              und dagegen halten können. Auch die zahlreichen zivilgesellschaftlichen
              Institutionen in diesem Bereich verdienen staatliche und politische
              Unterstützung und Anerkennung. Jeglichen staatlichen Generalverdacht
              und Druck gegen zivilgesellschaftliche Akteure, etwa anlasslose Überwachungen
              durch den Verfassungsschutz, lehnen wir ab.</p>

              <p><strong>Programmatik neu vermessen und Beteiligung stärken </strong></p>

              <p>Für uns als Partei steht 2020 der 40. Geburtstag an. Auf der BDK
              im November 2016 haben wir beschlossen, dass wir aus diesem Anlass ein
              neues Grundsatzprogramm erarbeiten und unsere Beteiligungsmöglichkeiten
              durch die Chancen von Digitalisierung ausweiten. Unser aktuelles Grundsatzprogramm
              „Die Zukunft ist Grün“ hat uns gute Dienste geleistet. Aber seit dem
              Beschluss im Jahr 2002 hat sich die Welt weitergedreht. Die Digitalisierung
              und Automatisierung stellt unsere Gesellschaften vor neue Herausforderungen
              und bietet gleichzeitig neue Chancen. Der gesellschaftliche Zusammenhalt
              ist brüchiger geworden, während die Globalisierung die Welt näher zusammenwachsen
              hat lassen. Die Klimakrise und das Artensterben haben sich beschleunigt.
              Die globalen Machtverhältnisse haben sich verändert. Europa steht vor
              neuen Aufgaben. Für uns gilt es, unsere grünen Antworten auf diese Herausforderungen
              anzupassen und mit neuen Visionen zu begeistern.</p>

              <p>Im Prozess zum Grundsatzproramm werden wir alle Ebenen der Partei
              einbinden und die Beteiligungsmöglichkeiten deutlich ausweiten. Zur
              Steuerung und Koordinierung des Prozesses bitten wir den Bundesvorstand,
              eine Grundsatzkommission einzusetzen. Der Startschuss für die Erarbeitung
              soll in der ersten Jahreshälfte 2018 gegeben werden. Die Mitglieder,
              die Landesverbände und Bundesarbeitsgemeinschaften sollen in zwei Diskussionsphasen
              eingebunden werden. Der gesamte Prozess soll durch einen online-gestützten
              Beteiligungsprozess begleitet werden. Dabei sollen mit inhaltlichen
              Mitgliederbefragungen und elektronischen Mitgliederbegehren neue Wege
              der Beteiligung gegangen werden. Wir werden dabei auf die gleichberechtigte
              Beteiligung von Frauen achten. Als Bewegungspartei wollen wir auch unsere
              Bündnispartner in den Prozess einbeziehen und uns mit ihren Forderungen
              auseinandersetzen.</p></div>'
