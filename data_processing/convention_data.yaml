    - '534':
        type: motion
        id: 534
        agenda_item: Beschlüsse (vorläufig)
        prefix: V-01 Beschluss
        title: Grüne Eckpunkte für die Gemeinsame Agrarpolitik der EU nach 2020
        title_with_intro: Grüne Eckpunkte für die Gemeinsame Agrarpolitik der EU nach
          2020
        title_with_prefix: 'V-01 Beschluss: Grüne Eckpunkte für die Gemeinsame Agrarpolitik
          der EU nach 2020'
        status_id: 3
        status_title: Eingereicht
        date_published: null
        supporters: []
        initiators:
          type: null
          name: null
          organization: null
        initiators_html: 'Bundesdelegiertenkonferenz (beschlossen am: 27.01.2018)'
        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p>Wir Grüne stehen
              für konsequenten Umwelt-, Tier- und Klimaschutz und kämpfen für gute
              Qualität der Böden, sauberes Wasser und reine Luft. Wir machen uns stark
              für den Schutz der Arten, die auf unserem Planeten leben. Auf diese
              Grundlage beruht Grüne Agrarpolitik. Verbraucher*innen sind auf gesunde
              und bezahlbare Nahrungsmittel angewiesen und Bäuer*innen in Europa wie
              in anderen Ländern auch auf faire Bedingungen am Markt. Daher brauchen
              wir eine global gerechte Agrarwende hin zu einer ökologischen europäischen
              Landwirtschaft, die die Vielfalt der Regionen Europas berücksichtigt.
              Wir wollen eine konsequente Umsetzung der 17 Ziele der Agenda 2030 der
              UNO (Sustainable Development Goals). Insbesondere ist die Umsetzung
              der Ziele nachhaltige Landwirtschaft, verantwortungsvoller Konsum und
              das Leben auf dem Land für eine europäische nachhaltige und faire Landwirtschaft
              wichtig.</p>

              <p>Wir streiten seit langem dafür, bestehende Spielräume für die Agrarwende
              im Rahmen der Umsetzung der Gemeinsamen Agrarpolitik der EU (GAP) auf
              mitgliedsstaatlicher Ebene auszunutzen. Für die GAP nach 2020 fordern
              wir eine ziel- und leistungsorientierte Förderpolitik, die mit Instrumenten
              des Fachrechts, der Marktordnung und der Handelspolitik abgestimmt ist.
              Solch eine Neuausrichtung der GAP muss die gesamte Wertschöpfungskette
              von den landwirtschaftlichen Vorstufen über die Produktion, den Handel
              und die Verarbeitung bis hin zu den Verbraucher*innen in den Blick nehmen.
              Unser agrar- und ernährungspolitisches Ziel ist es, alle Menschen mit
              gesunden Lebensmitteln zu versorgen, die Grenzen unseres Planeten zu
              respektieren und dabei regionale Wirtschaftspotentiale hier wie außerhalb
              der EU zu entwickeln.</p>

              <p>Europas gemeinsame Agrarpolitik wurde eingeführt, um unter anderem
              eine stabile Versorgung mit bezahlbaren Lebensmitteln sicherzustellen.
              Seit 2003 werden 70 Prozent der GAP-Subventionen, also rund 40 Milliarden,
              über die so genannte 1. Säule als pauschale Flächenprämie an die Betriebe
              ausgeschüttet. Diese leistungsungebundenen Zahlungen belohnen lediglich
              Besitz und Größe und verstärken so das „Wachsen oder Weichen“ in der
              Landwirtschaft. Durch das sogenannte Greening wurde zwar ein Teil der
              Zahlungen seit 2013 an Umweltleistungen gekoppelt, die Anforderungen
              wurden jedoch im Zuge der Verhandlungen stark aufgeweicht. Die anderen
              30 Prozent des GAP-Budgets werden als leistungsgebundene 2. Säule für
              Maßnahmen zur Entwicklung des ländlichen Raumes und für Klima-, Tier-,
              Arten- oder Naturschutz verwendet. So entspricht die 2. Säule stärker
              dem Grundsatz „öffentliches Geld für öffentliche Güter“. Diese Gelder
              müssen im Gegensatz zu den Direktzahlungen der 1. Säule durch die Bundesländer
              kofinanziert werden.</p>

              <p>Auch nach der GAP-Reform von 2013 gingen der dramatische Strukturwandel
              hin zu immer weniger und immer größeren Betrieben und das Höfesterben
              in der bäuerlichen Landwirtschaft weiter. Die Ausrichtung der GAP auf
              Kostenführerschaft und Export erwies sich als Sackgasse für viele Betriebe.
              Zudem zeigte sich, dass die Maßnahmen zum Schutz des Klimas, des Bodens,
              der Gewässer und der Arten bei weitem nicht ausreichen. Denn Billigessen
              ist nur an der Kasse billig. Die Folgekosten der fortschreitende Intensivierung
              der Landwirtschaft etwa durch Trinkwasseraufbereitung, Sanierung von
              Gewässern, Naturschutzmaßnahmen zum Ausgleich für die schwindende Artenvielfalt
              oder Kosten im Gesundheitssystem, tragen nicht die Verursacher*innen
              sondern die öffentliche Hand. Somit zahlen Steuerzahler*innen dreifach
              für Lebensmittel: An der Ladentheke, durch Steuergelder im Rahmen der
              GAP und durch Steuergelder für die externalisierten Kosten industrieller
              Landwirtschaft. Viele kleine Betriebe hingegen können im Wettbewerb
              mit der Agrarindustrie oft nicht mithalten – obwohl sie produzieren,
              was europäische Verbraucher*innen zunehmend nachfragen: regional, saisonal
              oder bio.</p>

              <p>Die gemeinsamen Herausforderungen der EU wie beispielsweise die Bekämpfung
              der Jugendarbeitslosigkeit und der Brexit, durch den die EU einen Nettozahler
              verlieren wird, erhöhen den Druck auf den EU-Haushalt und somit auch
              den Druck zu Ausgabenkürzungen im Agrarhaushalt. Für uns ist aber klar:
              Die europäische Agrarwende braucht die Unterstützung der öffentlichen
              Hand - allerdings anders als bisher. Landwirt*innen sollen vergütet
              werden - wenn sie gesellschaftliche Ziele umsetzen, die über den gesetzlichen
              Standard hinausgehen<em>.</em> Zentral ist die Schaffung von zusätzlichen
              ökologischen Vorrangflächen. Zudem sollen mehr biodiversitätsfördernde
              Maßnahmen wie z.B. Blühstreifen, Hecken und Feldlerchenfenster gefördert
              werden.<br>

              In einer Politik unter dieser Prämisse kann die klassische Agrarförderung
              als unkonditionierte Leistung nicht erhalten bleiben. Um die GAP neu
              zu legitimieren, soll sie folgende Eckpunkte umfassen.</p>

              <h2>Zehn Eckpunkte für die GAP nach 2020</h2><h3><strong>1. Schutz der
              Artenvielfalt, Gewässer und Böden</strong></h3><p>Monokulturen, Pestizide,
              ein zu hoher Nährstoffeinsatz, schwere Geräte auf den Äckern und Flächenverbrauch
              schädigen unsere Natur besorgniserregend. Die Zahl an ausgestorbenen
              und bedrohten Arten hat dramatische Ausmaße angenommen. Bisherige Bemühungen
              um Greening, Förderung von Blühstreifen, Fruchtfolgeauflagen oder integrierter
              Pflanzenschutz wurden regelmäßig soweit aufgeweicht, dass die Maßnahmen
              nicht den notwendigen Erfolg gezeigt haben. Eine Ökologisierung der
              Landwirtschaft soll grundlegende Zielsetzung der GAP sein, damit unsere
              Landschaft nicht weiter in Schutz- und Schmutzgebiete auseinander driftet.
              Landwirtschaftliche Flächen müssen gleichzeitig Lebensraum für Vögel,
              Insekten, wildlebende Kleintiere und Wildkräuter sein. Maßnahmen zum
              Erhalt und Verbesserung der natürlichen Bodenfruchtbarkeit und Gewässerreinhaltung
              müssen honoriert werden. Es müssen deutliche Regeln für den Verzicht
              auf Pestizide, für weniger Nährstoffeinsatz, Fruchtfolgen und natürliche
              Flächen wie zum Beispiel Gewässerrand- oder Blühstreifen sowie Hecken
              gesetzt werden. Auch in Naturschutzgebieten wird Landwirtschaft betrieben.
              Das widerspricht dem Ziel des Naturschutzes, daher soll der Einsatz
              von Pestiziden in Naturschutzgebieten nicht mehr gestattet sein.</p>

              <h3><strong>2. Klimaschutz</strong></h3><p>18 Prozent der durch den
              Menschen verursachten Treibhausgase werden in der Landwirtschaft erzeugt.
              Die industrielle Tierhaltung verursacht große Mengen klimaschädlicher
              Gase wie Lachgas und Methan. Zudem setzen großflächige Urwaldabholzung
              für Futtersoja und Palmöl, die Zerstörung von Moorböden und der ungezielte
              und übermäßige Einsatz von Stickstoffdünger in der Agrarwirtschaft große
              Mengen an Treibhausgasen frei. Politisch muss deshalb die gentechnikfreie
              Futtermittelerzeugung vor Ort, der Schutz von Wäldern, Mooren und klimaschützender
              Ackerbau ohne CO2-intensive Inputs unterstützt werden. Massentierhaltung
              muss beendet werden. Die Tierhaltung muss flächengebunden an die naturräumlichen
              Voraussetzungen angepasst werden - dort, wo das Futter von weit her
              gekarrt werden muss, sollten weniger Tiere gehalten werden. Für die
              gegenwärtig praktizierte Tierhaltung haben wir weder die Ackerflächen,
              um Futtermittel umweltverträglich anzubauen. Noch wird es uns gelingen,
              die anfallenden Güllemassen so auszubringen, dass sie von Pflanzen und
              Boden tatsächlich in einem verträglichen Maß aufgenommen werden können.</p>

              <h3><strong>3. Tierschutz</strong></h3><p>Die rasante Veränderung landwirtschaftlicher
              Betriebe hat in den letzten Jahrzehnten zu großem Tierleid geführt.
              Es sind Haltungsformen und Zuchtlinien entstanden, die Qualzuchten darstellen,
              die Tiergesundheit negativ beeinflussen und ethisch nicht tolerierbar
              sind. Zudem wird die Erhaltung vielfältiger und regional angepasster
              Tierrassen, der Beitrag von Tieren zu Kulturlandschaften und die biodiversitätsfördernde
              und besonders tiergerechte Beweidung nicht ausreichend honoriert. Den
              Umbau zu einer gesellschaftlich akzeptierten Tierhaltung soll ein besonderes
              Augenmerk eingeräumt werden. Wir fordern deshalb, die GAP-Mittel verstärkt
              für den Umbau der Tierhaltung einzusetzen. Dabei sollen keine kosmetischen
              Korrekturen, sondern große Schritte für bessere Haltungsbedingugen gefördert
              werden, beispielsweise durch ganzjährige Weidehaltung von Robustrassen.
              Weiterhin sollen mobile Schlachteinrichtungen gefördert werden, um Lebendtransporte
              von Schlachttieren zu vermeiden.</p>

              <h3><strong>4. Ausbau ökologischer Landwirtschaft</strong></h3><p>Wir
              wollen den ökologischen Landbau fördern. Denn die ökologische Landwirtschaft
              erfüllt durch ihr Kreislaufdenken und ihren Verzicht auf Pestizide und
              Kunstdünger den höchsten Standard im Hinblick auf den Schutz von Wasser,
              Boden, Luft und Klima. Biolebensmittel weisen zudem deutlich weniger
              Rückstände von Pestiziden und Antibiotika auf und sind daher gesünder.
              Dieser Goldstandard muss besonders gefördert werden, denn er ist Vision,
              Vordenker und Innovator für eine vielfältige und nachhaltige Land- und
              Lebensmittelwirtschaft. Durch gezielte Hilfen soll die Zahl von Biobetrieben
              maßgeblich gesteigert werden. Derzeit wird Ökolandbau erst auf etwa
              8% der landwirtschaftlichen Flächen betrieben. Wir wollen diese Art
              der mensch-, tier- und umweltverträglichen Landwirtschaft erheblich
              ausbauen. Die Förderung der Landwirtschaft soll so an ökologische Kriterien
              geknüpft werden, dass die gesamte landwirtschaftliche Fläche in absehbarer
              Zeit klima- und umweltgerecht bewirtschaftet wird.</p>

              <h3><strong>5. Zukunft der Arbeit in der Landwirtschaft</strong></h3><p>Ausdrücklich
              räumen wir der Arbeit in der Landwirtschaft einen besonderen Stellenwert
              ein. Denn die ökologische Verantwortung für die Natur, die ökonomische
              Verantwortung für den Lebensunterhalt und die regionale Verantwortung
              der Vertriebswege stellen hohe Anforderungen. Kleinere Betriebe wirtschaften
              zwar nicht automatisch ökologischer, erfüllen aber wichtige Funktionen
              für ländliche Räume. Wir wollen die Vielfalt der Betriebe erhalten und
              die Betriebe unterstützen, die durch eine ökologische Anbauweise und
              durch tiergerechte, kreislaufbasierte Tierhaltung die Umwelt schützen,
              anstatt sie zu belasten. Der bäuerliche Beruf soll wieder eine Zukunftsperspektive
              auch für den Nachwuchs werden.</p>

              <p>Aufwendige, bürokratische Anträge und eine ungebundene Flächenprämie
              helfen großen, intensiven Betrieben. Daher ist es besonders wichtig,
              die bürokratischen Anforderungen der Gelder der 2. Säule zu senken,
              um Naturschutzmaßnahmen beispielsweise auch in Mittel- und Osteuropa
              leichter umsetzbar zu machen. Naturschutz wird auch dann eher umgesetzt,
              wenn die Pacht für die Flächen niedrig ist. Dem widerspricht aber die
              Logik der 1. Säule, die die Pachten derzeit in die Höhe treibt. Für
              eine zukunftsfähige Landwirtschaft muss die Gemeinsame Marktordnung
              eine zentralere Position im Rahmen der GAP einnehmen und wirksame Kriseninstrumente
              zum Beispiel zur Mengenregulierung bei Milchmarktkrisen beinhalten.
              Diese sozial- und agrarpolitische Maßnahmen betreffen die gesamte Wertschöpfungskette,
              in der Bäuer*innen gegenüber dem vorgelagerten Bereich, der Lebensmittelverarbeitung
              und dem Handel sowie der Aufbau lokaler Märkte gestärkt werden müssen<em>.
              </em></p>

              <h3><strong>6. Wissenschaft, Beratung, Bildung und Information</strong></h3><p>Für
              die Entwicklung hin zu einer ökologischen und tiergerechten Landwirtschaft
              müssen Wissenschaft und Forschung viel mehr auf den Schutz von Boden,
              Wasser, wildlebenden Pflanzen und Tieren sowie dem Klima abzielen. Dazu
              muss die Forschungsförderung auf diese Fragestellungen ausgerichtet
              und der Wissenstransfer in die Praxis gewährleistet werden. Eine fortschrittliche
              nachhaltige Landwirtschaft kann nur durch umfassende Beratung entlang
              der gesamten Wertschöpfungskette erreicht werden. In Ausbildung und
              Studium muss der ökologischen Landwirtschaft sowie agroökologischen
              Wirtschaftsweisen einen wesentlich höheren Stellenwert eingeräumt werden.
              Das Wissen über landwirtschaftliche Produktionsprozesse und über gesunde
              Ernährung nimmt ab und damit auch die Wertschätzung von landwirtschaftlicher
              Arbeit und Erzeugnissen. Eine umfassende Ernährungsbildung in Kitas
              und Schulen kann die Menschen bei der Entscheidung für das richtige
              Lebensmittel unterstützen.</p>

              <h3><strong>7. Regionale Wirtschaft in ländlichen Regionen</strong></h3><p>Viele
              ländliche Regionen Europas stehen durch den Strukturwandel in der Landwirtschaft
              vor großen Herausforderungen. Qualifizierte Arbeitsplätze gehen zunehmend
              verloren, junge Menschen zieht es in die Städte und ganze Landstriche
              drohen zu veröden. Andere ländliche Regionen Europas wie beispielsweise
              Teile Rumäniens und Bulgariens besitzen noch viel Entwicklungspotential
              in der Landwirtschaft. Um ländlichen Regionen hier Perspektiven zu eröffnen,
              müssen die Gelder der GAP auch dazu beitragen, regionale Wirtschaftspotentiale
              zu entwickeln. So kann etwa die Gründung von Regionalmarken Verbraucher*innen
              für den heimischen Markt gewinnen. Wichtig dafür sind jedoch hohe Standards,
              damit Verbraucher*innen bei Regionalität auf gute Qualität und ökologische
              Erzeugung schließen können. Ein Schwerpunkt soll dabei auf dem Auf-
              und Ausbau regionaler Wertschöpfungsketten, regionaler (Direkt-)Vermarktung
              und handwerklicher Lebensmittelverarbeitung liegen. Wie die aktuellen
              positiven Entwicklungen in der Biobranche und bei den Direktvermarktern
              zeigen, hat Grüne Politik hier schon Gewinner erzeugt. Neue Modelle
              der Stadt-Land-Kooperationen wie die solidarische Landwirtschaft oder
              Ernährungsräte können jungen Menschen auf dem Land eine Zukunft eröffnen
              und Menschen in der Stadt regionale Lebensmittel liefern. Wir wollen
              den ländlichen Raum bei der Wertschöpfung der Lebensmittelbranche maßgeblich
              beteiligen und ländliche Räume mit ihren spezifischen Traditionen und
              Kulturlandschaften unterstützen.</p>

              <h3><strong>8. Transparente Kennzeichnung</strong></h3><p>Wir wollen
              eine bessere Kennzeichnung von Lebensmitteln, um die Agrarwende zu beschleunigen.
              Noch klarer ist die Kennzeichnung beim Hühnerei: eine einfache Zahl
              gibt Auskunft über Haltungsbedingungen der Legehennen und bietet Verbraucher*innen
              somit eine echte Entscheidungsmöglichkeit beim Einkauf. Das Bio-Siegel
              bietet eine eindeutige Orientierung an der Ladentheke, die die ökologische
              Landwirtschaft unterstützt. Wir fordern nach diesem Vorbild eine transparente
              und eindeutige Kennzeichnung für alle Lebensmittel, die Verbraucher*innen
              Klarheit über Herkunft und Herstellungsweise der Produkte bringt. In
              ganz besonderem Maße gilt dies für den Bereich der verarbeiteten Produkte:
              Hier müssen klare Herkunftskennzeichnungen und eindeutige Angaben zur
              Art der Erzeugung her, damit Verbraucher*innen eine bewusste Kaufentscheidung
              treffen können. Damit schaffen wir mehr Transparenz, mehr Konsumentensouveränität
              und auch mehr Lebensmittelsicherheit. Dabei sollen kleinere Betriebe
              nicht mehr belastet werden als hochtechnisierte Großbetriebe. Wir wollen
              eine verpflichtende Tierhaltungskennzeichnung schaffen und setzen uns
              ein für eine klarere Kennzeichnung von veganen und vegetarischen Lebensmitteln.
              Zur Agrarwende gehört für uns auch, die Lebensmittelverschwendung entlang
              der gesamten Warenkette durch verbindliche Ziele ebenso wie die Verpackungsflut
              zu begrenzen.</p>

              <h3><strong>9. Agenda 2030 und SDG 2 konsequent umsetzen</strong></h3><p>Das
              Menschenrecht auf Nahrung muss global gesichert werden. Die globale
              Agrarwende und der Kampf gegen Hunger und Mangelernährung weltweit müssen
              zusammen gedacht werden. Denn die intensive europäische Landwirtschaft
              hat enorme Auswirkungen auf die Ernährungssicherung und die Ernährungssouveränität
              in den Ländern des globalen Südens. Entsprechend darf auch die GAP dem
              Grundsatz-Artikel 208 im Vertrag von Lissabon nicht widersprechen. Was
              durch Entwicklungsprogramme in anderen Ländern aufgebaut wird, darf
              nicht durch die negativen Folgen anderer Politikbereiche wieder zurück
              geworfen werden. Egal ob Saatgut, Düngemittel oder Pestizide - immer
              weniger Konzerne bestimmen in immer größerem Maße den Agrarsektor. Das
              schadet sowohl bäuerlichen Betrieben hier in Europa als auch Kleinbäuer*innen
              weltweit. EU-Agrarprodukte zu Dumpingpreisen dürfen nicht die Märkte
              Afrikas, Asiens und Latein-Amerikas überfluten und so die Lebensgrundlage
              von Millionen von Menschen zerstören. Unsere im Überschuss hergestellten
              billigen Lebensmittel zwingen bei uns und in anderen Ländern Bäuer*innen
              zur Betriebsaufgabe oder nehmen ihnen zumindest Entwicklungschancen.
              Unser Überschuss wird zudem auf Kosten der Ressourcen und der Fläche
              in den Ländern des globalen Südens produziert, die den Menschen dort
              für den Anbau ihrer Lebensmittel fehlen.</p>

              <p>Für die nächste GAP-Reform erwarten wir von der EU-Kommission mehr
              als Lippenbekenntnisse zur Kohärenz mit entwicklungspolitischen Zielen.
              Die EU muss zum Ziel haben, Kleinbäuer*innen in den Ländern des Globalen
              Südens dabei zu unterstützen, mit agrarökologischen Methoden Lebensmittel
              für lokale und regionale Märkte herzustellen und so zur Ernährungssicherung
              beizutragen. Gleichzeitig müssen die Länder auch stärker beim Aufbau
              von Wertschöpfungsketten für die wachsenden städtischen Märkte unterstützt
              werden, um zur Entwicklung der Länder beizutragen. Mittels eines Beschwerdemechanismus
              muss sichergestellt werden, dass Fällen unerwünschter Auswirkungen der
              GAP auch nachgegangen wird, auch wenn bestehende handelsrechtliche Kategorien
              wie Dumping nicht erfasst werden. In der Verordnung zur GAP sollte auch
              ein systematisches Monitoring der externen Auswirkungen eingeführt werden.
              Diese Verantwortung darf die Kommission nicht auf Dritte wie Forschungsinstitute
              oder NGOs abwälzen.</p>

              <h3><strong>10. Fairer Agrarwelthandel</strong></h3><p>Wir fordern Handelsabkommen,
              die hohe Standards schützen, Möglichkeiten der Weiterentwicklung bieten
              und Anreize dafür schaffen. Regionale, nachhaltige Landwirtschaft darf
              durch Agrarhandel nicht gefährdet werden - weder in der EU noch anderswo.
              Die transatlantischen Abkommen gefährden bäuerliche Betriebe und bedrohen
              Umwelt- und Verbraucherstandards. Der Abschluss von CETA ermöglicht,
              dass TTIP quasi durch die Hintertür angewendet wird. Die Interessen
              großer Konzerne wie große Molkereien und Foodmultis stehen dabei über
              den Interessen des Gemeinwohls. Die Möglichkeit des Importes gentechnisch
              veränderter Pflanzen oder geklonter Tiere nach Europa muss unterbunden
              werden. Die Art der Herstellung, Verarbeitung und Kennzeichnung von
              Lebensmitteln muss demokratisch und nicht vor Schiedsgerichten entschieden
              werden. Global und regional müssen wir faire und nachhaltige Spielregeln
              im Agrarhandel schaffen. Dazu gehört auch, die Länder des Globalen Südens
              nicht durch Handelsabkommen zur Öffnung ihrer Agrarmärkte zu zwingen
              und sie beim Aufbau von Wertschöpfung und Erfüllung von Produktstandards
              zu unterstützen.</p>

              <h2>Für eine Neuausrichtung der GAP nach 2020</h2><p>Für konsequenten
              Umwelt- und Klimaschutz, die Qualität der Böden, des Wassers und der
              Luft sowie den Schutz der Arten und Tiere unseres Planeten brauchen
              wir eine Neuausrichtung der Europäischen Agrarpolitik. Auch weil der
              Druck auf den EU-Haushalt steigt, muss sich die GAP neu legitimieren.
              Dabei steht für uns aber fest, dass die europäische Agrarwende öffentliche
              Mittel braucht. Denn nur so erreichen wir den Umbau hin zu einer ökologischen
              und tiergerechten europäischen Landwirtschaft, die den Bäuer*innen in
              Europa und in sich entwickelnden Ländern faire Lebens- und Arbeitsbedingungen
              ermöglicht und gesundes und bezahlbares Essen produziert.<br>

              <br>

              In Zukunft sollen alle GAP-Zahlungen verstärkt an landwirtschaftliche
              Betriebe gehen, die in den Bereichen des Umwelt-, Natur, Klima- und
              Tierschutzes nachweislich gesellschaftliche Leistungen erbringen. Die
              Zahlungen sollen nicht nur eine Ausgleichs-, sondern auch eine Anreizkomponente
              für umwelt-, natur-, klima- und tiergerechtes Wirtschaften enthalten.
              Außerdem machen wir uns für einen Naturschutzfonds in Höhe von 15 Milliarden
              Euro stark, der die Leistungen von Bäuer*innen und anderen Landnutzer*innen
              im Bereich der Biodiversität honoriert.</p>

              <p>Wir fordern eine transparente, ziel- und leistungsorientierte Förderpolitik,
              die gesellschaftliche Ziele, die mit Instrumenten des Fachrechts, der
              Marktordnung und einer fairen Handelspolitik abgestimmt ist und das
              Nachhaltigkeitsziel 2 der Agenda 2030 umsetzt. Durch ein systematisches
              Monitoring sollen die externen Effekte der GAP überprüft werden. Alle
              staatlichen Unterstützungsmaßnahmen müssen offengelegt und für alle
              sichtbar sein. Der Übergang zu einer neuen Förderlandschaft erfordert
              Zeit und Planungssicherheit, um Landwirt*innen eine Umstellung zu ermöglichen.
              Solch eine Neuausrichtung der GAP muss die gesamte Wertschöpfungskette
              von den landwirtschaftlichen Vorstufen über die Produktion, den Handel
              und die Verarbeitung bis hin zu den Verbraucher*innen in den Blick nehmen.
              So erhöht sich die Akzeptanz der GAP und verbessern sich die Perspektiven
              der ländlichen Räume.</p></div>'
