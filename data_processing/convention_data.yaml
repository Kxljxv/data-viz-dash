        title: Einmarsch der Türkei in Syrien ist völkerrechtswidrig – Rüstungsexporte
          an die Türkei umgehend stoppen
        title_with_intro: Einmarsch der Türkei in Syrien ist völkerrechtswidrig –
          Rüstungsexporte an die Türkei umgehend stoppen
        title_with_prefix: 'V-36 NEU Beschluss: Einmarsch der Türkei in Syrien ist
          völkerrechtswidrig – Rüstungsexporte an die Türkei umgehend stoppen'
        status_id: 3
        status_title: Eingereicht
        date_published: null
        supporters: []
        initiators:
          type: null
          name: null
          organization: null
        initiators_html: 'Bundesdelegiertenkonferenz (beschlossen am: 27.01.2018)'
        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p>Am 21. Januar
              2018 startete die Türkei mit der „Operation Olivenzweig“ den Einmarsch
              in die nordsyrische Region Afrin, die eines der Rückzugsgebiete für
              Flüchtlinge und Binnenvertriebene in Syrien ist. Unzählige Menschen
              sind bereits durch den Krieg Assads gegen seine eigene Bevölkerung und
              die barbarischen Verbrechen vom ISIS zur Flucht in genau dieses Gebiet
              gezwungen worden, sie dürfen nicht noch einmal den Horror von Krieg
              und Vertreibung erleben. Der türkische Militäreinsatz richtet sich gegen
              die YPG den militärischen Arm der kurdischen PYD, die die Autonomiebehörde
              kontrolliert. Doch sind auch zivile Opfer zu beklagen. Nach der entscheidenden
              Schwächung von ISIS, bei der unter anderem kurdische Milizen der YPG
              eine entscheidende Rolle gespielt haben, tritt der Krieg in Syrien mit
              der Invasion in eine weitere erschütternde Gewaltphase ein. Mit dem
              Einmarsch in Nordsyrien gießt Präsident Erdogan Öl in den regionalen
              Flächenbrand. Bündnis 90 / Die Grünen verurteilen diese Invasion als
              eine Verletzung des Völkerrechts sowie als eine unverantwortliche militärische
              Gewalteskalation. Das militärische Vorgehen der Türkei in Syrien wird
              die Lage dort dramatisch verschlimmern und das Ausmaß der humanitären
              Katastrophe weiter vergrößern. Bereits jetzt befinden sich laut UN-Angaben
              mehr als 5.000 Menschen auf der Flucht vor der türkischen Offensive.</p>

              <p>Der Einmarsch der Türkei ist einerseits innenpolitisch motiviert,
              er soll von der schlechten wirtschaftlichen Entwicklung und der tief
              gespaltenen Gesellschaft ablenken. Erdogans Außenpolitik der vergangenen
              Jahre ist krachend gescheitert. Von seinem Ansatz der „null Probleme
              mit den Nachbarn“ ist heute eine Situation voller Konflikte mit fast
              allen Nachbarn geworden. Nach der Aufkündigung der Friedensgespräche
              mit der PKK und einem unverhältnismäßigen militärischen Einsatz auch
              gegen die kurdische Zivilbevölkerung im Südosten der Türkei hat Erdogan
              es bisher nicht geschafft, eine tragfähige politische Lösung der sogenannten
              Kurdenfrage anzubieten. Gleichzeitig kritisieren wir auch die Nähe der
              YPG zur PKK, deren Teilorganisationen in der vergangenen Jahren schwere
              Terroranschläge in der Türkei auch gegen Zivilisten verübt haben. Dieses
              Anheizen der Gewaltspirale wird den innertürkischen Konflikt nicht lösen.
              Wir verurteilen diese Gewalt scharf. Die Verbindungen zwischen der YPG
              und der PKK rechtfertigen jedoch keinen Einmarsch in Syrien, für die
              Türkei sind sie aber ein berechtigter Grund zur Sorge.</p>

              <p>Andererseits nutzt der türkische Einmarsch vor allem den syrischen
              und russischen Kriegsinteressen, denn er richtet sich gegen die innenpolitische
              Opposition Assads und treibt einen Keil zwischen die Türkei und ihre
              NATO-Partner – allen voran die USA, die bislang die kurdischen Einheiten
              auch mit Waffen unterstützt haben. Damit rückt eine politische Lösung
              des Syrienkonflikts in weite Ferne.</p>

              <p>Der türkische Einmarsch zeigt zudem auch das Scheitern der deutschen
              und europäischen Türkeipolitik auf. Viel zu lange wurde kaum oder viel
              zu leise Kritik an den zunehmend autokratischen und unberechenbaren
              Kapriolen der türkischen Innen- und Außenpolitik geübt. Mit dem Flüchtlingsdeal
              hat sich die EU durch Erdogan erpressbar gemacht. Präsident Erdogan
              fühlt sich offensichtlich immun genug, um sich eine ganze Reihe innen-
              und außenpolitischer Eskalationen zu erlauben, ohne laute Kritik aus
              Berlin und Brüssel befürchten zu müssen. Die Bilder von offenkundig
              deutschen Leopard-2-Panzern in Syrien sind eine drastische Illustration
              der fehlgeleiten deutschen Rüstungsexportpolitik in Krisen- und Konfliktländer
              der letzten Jahre. Bundesaußenminister Sigmar Gabriel hat der Türkei
              gerade erst die Modernisierung der Panzer in Aussicht gestellt. Erneut
              rücken Menschenrechte und Demokratie in den Hintergrund, weil ein lukratives
              Angebot für Rheinmetall winkt.</p>

              <p>Auch die vermeintliche Entspannung der deutsch-türkischen Beziehungen
              ist nur Fassade, solange Deniz Yücel und andere politische Geiseln unschuldig
              in Haft sitzen. Deniz Yücel verdient unseren größten Respekt dafür,
              dass er in seinem letzten Interview deutlich gemacht hat, nicht durch
              schmutzige Deals mit der Türkei freikommen zu wollen. Es muss der deutschen
              und europäischen Außenpolitik gelingen, gegenüber der Türkei aus dem
              Teufelskreis aus Abhängigkeit und Eskalation auszubrechen.</p>

              <p>Wir GRÜNE haben intensiv über den Umgang mit den entstandenen Konflikten
              und deren mögliche Deeskalation diskutiert und sind nicht den leichten
              Weg vieler anderer gegangen, einfache Antworten auf komplizierte Fragen
              zu geben. Wir haben uns für umfassende zivile und politische Lösungen
              stark gemacht. Die kann es aber nur geben, wenn die internationale Gemeinschaft
              ihren politischen Willen dazu deutlich erhöht.</p>

              <p>Die Entwicklung hat der letzten Woche in erschreckender Eindeutigkeit
              gezeigt, dass Frieden im Mittleren Osten ohne eine Einbeziehung kurdischer
              Interessen nicht machbar sein wird. Schon jetzt versuchen Menschen in
              der Region - seien es Kurd*innen, Alevit*innen, Araber*innen, Christ*innen,
              Jesid*innen, Assyrer*innen oder Armenier*innen - unter widrigen Umständen
              eine demokratische Gesellschaft aufzubauen. Vertreibungen, Diskriminierungen
              von Minderheiten und Menschenrechtsverletzungen, die nach wie vor stattfinden,
              verurteilen wir.</p>

              <p>Wir bekennen uns zu einem friedlichen, international getragenen Umgang
              mit der Kurdenfrage. Eine Lösung kann nicht in einer weiteren Eskalation
              des Krieges und weiterer militärischer Aufrüstung liegen, sondern muss
              friedlich, unter Einbeziehung der betroffenen Staaten und Interessengruppen
              sowie unter Wahrung des Völkerrechts erreicht werden.</p>

              <p>Wir kritisieren den Aufruf des türkischen Religionsattachés an die
              Gläubigen der DITIB- Gemeinden, die Sieg-Sure (Fetih) zu beten, in der
              es um das Ziel der Eroberung geht. Verherrlichung von Krieg und nationalistische
              Stimmungsmache lehnen wir ausdrücklich ab. Wir appellieren, die Diskussion
              über die aktuellen Entwicklungen in Syrien mit Argumenten und friedlich
              zu führen. Angriffe auf Moscheen oder kurdische Einrichtungen in Deutschland
              verurteilen wir.</p>

              <p>Mit Blick auf die jüngsten Entwicklungen fordern BÜNDNIS 90 / DIE
              GRÜNEN:</p>

              <ul>

              <li>Die Bundesregierung muss sich für einen sofortigen Stopp des türkischen
              Angriffs in Nordsyrien einsetzen.</li>

              </ul>

              <ul>

              <li>Die Bundesregierung muss umgehend die völkerrechtswidrige Intervention
              der Türkei innerhalb der NATO auf den Tisch bringen und darauf drängen,
              dass die NATO endlich geeignete Konsequenzen zieht - auch mit Blick
              auf die Awacs-Aufklärungsflüge.</li>

              </ul>

              <ul>

              <li>Mehr denn je müssen Deutschland und Europa klare Kante für Demokratie
              und Menschenrechte in der Türkei und in der Region zeigen. Das politische
              Handeln muss konsequent auf die Unterstützung der verbleibenden demokratischen
              Kräfte in der Türkei ausgerichtet werden.</li>

              </ul>

              <ul>

              <li>Alle deutschen Rüstungsexporte in die Türkei müssen umgehend gestoppt
              werden, bis die Türkei zu Demokratie und Rechtsstaatlichkeit zurückkehrt.
              Das gilt auch für die von der türkischen Regierung geforderte Aufrüstung
              der Leopard-II-Panzer, die offenkundig in der gegenwärtigen türkischen
              Militäroffensive eingesetzt werden. Ebenso gehören Pläne zur Beteiligung
              deutscher Unternehmen an Rüstungskonsortien, wie sie jüngst im Fall
              des Rheinmetallvorhabens zur Unterstützung des Aufbaus einer Panzerfabrik
              in der Türkei öffentlich wurden, ausnahmslos beendet. Die Gesetzeslücke,
              die solche Pläne ermöglicht, muss dringend geschlossen werden.</li>

              </ul>

              <ul>

              <li>Es braucht eine diplomatische Offensive gegenüber der Türkei und
              Vertreterinnen und Vertretern der kurdischen Bevölkerung in der Region,
              um Druck für eine politische Lösung der Kurdenfrage zu erreichen. Für
              die Zukunft der Region kann es nur eine friedliche und politische Lösung
              geben.</li>

              </ul>

              <ul>

              <li>Der Flüchtlingsdeal mit der Türkei schirmt Europa nicht nur vor
              Verantwortung, sondern Präsident Erdogan auch vor Kritik ab. Die EU
              hat sich dadurch gegenüber der Türkei erpressbar gemacht. Diesen Türkei-Deal
              wollen wir beenden. Zugleich sollte damit die europäische Unterstützung
              der über drei Millionen Flüchtlinge in der Türkei nicht abbrechen. Deren
              Versorgung nach humanitären Standards muss oberste Priorität haben.
              Auch braucht es dringend Kontingente zur Entlastung der dortigen Strukturen.</li>

              </ul>

              <ul>

              <li>Die Bundesregierung muss den politischen und wirtschaftlichen Druck
              auf die AKP- Regierung erhöhen, damit Deniz Yücel und alle anderen politischen
              Gefangenen endlich ein rechtsstaatliches Verfahren erhalten und alle
              unschuldig Inhaftierten frei kommen.</li>

              </ul>

              <ul>

              <li>Verhandlungen über eine Ausweitung der Zollunion kann es erst geben,
              wenn die Türkei eine Kehrtwende zurück zu Demokratie und Rechtsstaatlichkeit
              vollzieht. Das gilt auch für die Fortführung der Beitrittsgespräche,
              die de facto bereits auf Eis liegen. Europäische Heranführungshilfen
              sollten ausschließlich an zivilgesellschaftliche, pro- demokratische
              Organisationen ausgezahlt werden. Die Beitrittsgespräche jetzt aber
              komplett abzubrechen, würde das falsche Signal an die proeuropäischen
              und demokratischen Kräfte in der Türkei senden. Für eine demokratische
              und weltoffene Türkei müssen die Türen zur EU offen bleiben.</li>

              </ul>

              <ul>

              <li>Wir stehen an der Seite derer die für eine friedvolle Lösung auf
              der Grundlage von Völkerrecht und Menschenrechten in Deutschland gewaltfrei
              demonstrieren.</li>

              </ul></div>'
