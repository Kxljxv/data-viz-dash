    - '538':
        type: motion
        id: 538
        agenda_item: Beschlüsse (vorläufig)
        prefix: V-26 Beschluss
        title: Insekten- und Vogelsterben stoppen – Maßnahmen zum Schutz der biologischen
          Vielfalt
        title_with_intro: Insekten- und Vogelsterben stoppen – Maßnahmen zum Schutz
          der biologischen Vielfalt
        title_with_prefix: 'V-26 Beschluss: Insekten- und Vogelsterben stoppen – Maßnahmen
          zum Schutz der biologischen Vielfalt'
        status_id: 3
        status_title: Eingereicht
        date_published: null
        supporters: []
        initiators:
          type: null
          name: null
          organization: null
        initiators_html: 'Bundesdelegiertenkonferenz (beschlossen am: 27.01.2018)'
        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p><strong>Insekten-
              und Vogelsterben stoppen – Maßnahmen zum Schutz der biologischen Vielfalt</strong></p>

              <p>Wir erleben momentan ein dramatisches Insekten- und Vogelsterben.
              Erhebungen – wie die Krefelder Studie sowie zahlreiche weitere Studien,
              durchgeführt in unterschiedlichsten Gebieten Deutschlands und Europas
              – zeigen Verluste von bis zu 75% der Insekten-Biomasse. Diese empirischen
              Daten lassen sich auch praktisch erleben: wo noch vor 20, 30 Jahren
              im Sommer nach einer längeren Autofahrt die Windschutzscheibe voller
              Insekten war, bleibt die Windschutzscheibe heute quasi Insekten-frei.</p>

              <p>Der Rückgang der Insekten hat weitreichende Folgen. Denn wo Insekten
              fehlen, finden auch Fledermäuse und Vögel keine Nahrung mehr, ihre Population
              ist u.a. durch den Insektenrückgang im Fortbestand bedroht: Drei von
              vier heimischen Vogelarten gelten mittlerweile als gefährdet. Seit 1990
              sind besonders die Vögel der Agrarlandschaft bedroht. Der Bestand des
              Kiebitzes ist um 80 Prozent, des Braunkehlchens um 63 Prozent, der Uferschnepfe
              um 61 Prozent und des Rebhuhns um 84 Prozent zurückgegangen. Selbst
              „Allerweltsarten“ wie Feldlerche und Haussperling stehen mittlerweile
              auf den Roten Listen. Insgesamt ist in der EU ein Verlust von rund 300
              Millionen Brutpaaren seit 1980 zu beklagen.</p>

              <p>Global und national herrscht seit Jahrzehnten ein dramatisches Artensterben.
              Das Netz der Arten und Nahrungsnetze drohen zu zerreißen. Allein 39
              Wildbienenarten sind inzwischen in Deutschland ausgestorben. Weltweit
              sind ca. 18 000 wirbellose Arten vom Aussterben bedroht. Diese Bedrohung
              der biologischen Vielfalt hat unabsehbare Konsequenzen für das ökologische
              Gleichgewicht der Erde. Ähnlich wie bei der Klimakrise müssen wir jetzt
              handeln, um nicht den Kipp-Punkt der biologischen Vielfalt zu überschreiten,
              nach dem Naturkreisläufe nicht mehr funktionsfähig sind.</p>

              <p>Denn Bienen, Wildbienen und Schmetterlinge sind zuständig für die
              Bestäubung von Pflanzen. Vier Fünftel der bei uns heimischen Nutz- und
              Wildpflanzen sind sie angewiesen. Seriöse Schätzungen gehen von 230
              bis 570 Milliarden Dollar aus, die diese Bestäuberleistung weltweit
              jährlich wert ist.</p>

              <p>Schon 2007 beschloss Deutschland unter Umweltminister Sigmar Gabriel
              eine Nationale Strategie zur biologischen Vielfalt, mit dem Ziel, bis
              2020 das Artensterben zu stoppen. Die hehren, auch internationalen,
              Ziele stehen jedoch in einem eklatanten Missverhältnis zu den bisher
              umgesetzten Maßnahmen zur Bekämpfung des Artensterbens. Weil die Agrar-
              und Naturschutzpolitik unter den letzten Regierungen wirkungslos waren,
              sind wir diesen Zielen nicht näher gekommen.</p>

              <p>Wir GRÜNE kämpfen für den Artenreichtum und die biologische Vielfalt.
              Wir wollen die Agrar- und Naturschutz-, Umwelt- und Wirtschaftspolitik
              so ausrichten, dass gute Rahmenbedingungen mehr Artenschutz und Erhalt
              der Vielfalt garantieren und fordern Sofortmaßnahmen im Kampf gegen
              das Artensterben.</p>

              <p><strong>Insekten- und vogelfreundliche Landwirtschaft fördern</strong></p>

              <p>In den letzten Jahrzehnten ist die Landwirtschaft vom Träger der
              Biodiversität zu einer ihrer größten Bedrohungen geworden. Weitflächige
              Monokulturen, die intensive und großflächige Nutzung von Grünland, häufige
              Wiesenmahd und der Rückgang von Landschaftsstrukturelementen wie Hecken
              und Streuobstwiesen oder Wacholderheiden haben zum Verschwinden von
              Lebensräumen für Insekten, Vögel und anderen Tieren geführt. Fehlentwicklungen
              wie Stickstoffüberschüsse, Erosion oder Belastungen mit Pestiziden und
              haben unübersehbare Folgen. Drastische Verluste an Insektenbiomasse,
              welche in Naturschutzgebieten gemessen wurden, zeigen, dass selbst Schutzgebiete
              die bisherigen Räume für die Natur nicht für den Erhalt vieler Arten
              ausreichen. Zentral ist deshalb die Schaffung von zusätzlichen Blühstreifen,
              Hecken, Feldlerchenfenster, Extensiv-Grünland oder Streuobstwiesen auf
              jedem landwirtschaftlichen Betrieb.</p>

              <p><strong>Wie wir Gifte vom Acker bekommen </strong></p>

              <p>Der großflächige, häufige Pestizideinsatz gehört zu den stärksten
              Treibern des Artensterbens. Die Wirkstoffmenge ist in den letzten 20
              Jahren um rund ein Drittel gestiegen: von 1994 bis 2015 von knapp 27.000
              Tonnen auf knapp 35. Ackergifte treffen nicht nur die Lebewesen, gegen
              die sie eingesetzt werden. Sie vernichten sowohl Wildkräuter als auch
              Insekten. Die Folgen sind alarmierend: Heute leben über 50 Prozent weniger
              Vögel als noch vor 30 Jahren auf den landwirtschaftlichen Flächen Deutschlands.
              Auch 35 Prozent der Ackerwildkräuter sind bereits verschwunden. Auf
              dem Land sehen wir Rückgänge bei nahezu allen Lebewesen, weil komplette
              Nahrungsnetzwerke zusammenbrechen.</p>

              <p>Dabei belegen zahlreiche Studien, dass große Einsparungen beim Pestizideinsatz
              ohne Ertragseinbußen möglich sind. <strong>Deshalb wollen wir eine umfassende
              Pestizidreduktionsstrategie umsetzen</strong>, um Ackergifte von unseren
              Feldern zu bekommen und Vögel, Insekten und Wildkräuter zu schützen<strong>.
              </strong>Dazu gehört</p>

              <ul>

              <li>Anreize zu schaffen für eine deutliche Senkung des Einsatzes, dazu
              gehört auch eine Abgabe auf die Produktion von Pestiziden, um dem Verursacherprinzip
              Rechnung zu tragen und die Unterstützung pestizidfreier Bewirtschaftungsmethoden,</li>

              </ul>

              <ul>

              <li>ein Verbot des Einsatzes von Pestiziden in Natur- und Trinkwasserschutzgebieten,
              ökologisch sensiblen Bereichen und deren Pufferflächen, Vogelschutz-
              und FFH-Gebieten und auf artenreichem Grünland,</li>

              </ul>

              <ul>

              <li>die verbindliche, rechtssichere sowie sanktionsfähige Definition
              der „Guten Fachlichen Praxis“ im Einklang mit ökologischen Notwendigkeiten,</li>

              </ul>

              <ul>

              <li>die Förderung oder Festschreibung vielfältiger Fruchtfolgen,</li>

              </ul>

              <ul>

              <li>Rand- und Pufferstreifen einrichten, um die Abdrift von Pestiziden
              auf andere Flächen oder in Gewässer zu verhindern,</li>

              </ul>

              <ul>

              <li>die verbindliche Umsetzung aller Vorgaben des Integrierten Pflanzenschutzes,
              inkl. der Vorhaltung von Kontrollparzellen (und damit auch Schaffung
              von pestizidfreien Flächen im Kulturland),</li>

              </ul>

              <ul>

              <li>die Verbesserung der Zulassungsverfahren, inkl. der Forderung, wirkstoffspezifische
              Ausgleichsflächen festzuschreiben,</li>

              </ul>

              <ul>

              <li>der Ausbau der unabhängigen Pflanzenschutz-Beratung für Landwirte,</li>

              </ul>

              <ul>

              <li>die Förderung des und deutlich ausgebaute Forschung für nicht-chemischen
              Pflanzenschutz. Dafür sind mindestens 20 Prozent der Forschungsmittel
              im Agrarbereich in den Ökolandbau zu investieren, und die Mittel für
              die Erforschung robuster Sorten deutlich aufzustocken. Das kommt in
              gleichem Maß auch der konventionellen Landwirtschaft, die nachhaltiger
              wirtschaften will, zu Gute,</li>

              </ul>

              <ul>

              <li>die Vermarktungsförderung von Lebensmittelprodukten, die pestizidfrei
              erzeugt wurden.</li>

              </ul>

              <p><strong>Glyphosatausstieg jetzt </strong></p>

              <p>Glyphosat wird momentan auf 40% der deutschen Ackerfläche eingesetzt,
              obwohl Totalherbizide wie Glyphosat, die gegen alle Pflanzen toxisch
              wirken und diese abtöten, besonders fatal auf die Agrobiodiversität
              wirken.</p>

              <p>Der Alleingang des geschäftsführenden Bundeslandwirtschaftsministers
              Schmidt begrub die Chance für einen EU-weiten Ausstieg aus der Nutzung
              von Glyphosat. Deshalb muss jetzt der nationale Ausstieg eingeleitet
              und ein Ausstiegsplan mit umweltfreundlichen Alternativen erarbeitet
              werden. Nun geht es um Schadensbegrenzung auf nationaler Ebene. Zum
              Schutz der Artenvielfalt, zur Wahrung des Vorsorgeprinzips und im Schulterschluss
              mit den französischen Partner*innen wollen wir <strong>den Glyphosateinsatz
              in Deutschland rechtssicher beenden. </strong></p>

              <p>Deshalb wollen wir</p>

              <ul>

              <li>den Einsatz von Glyphosat für den privaten Gebrauch und auf öffentlichen
              Flächen sofort untersagen,</li>

              </ul>

              <ul>

              <li>größtmögliche Anwendungsbeschränkungen für landwirtschaftliche Bereiche
              erlassen, damit auch dort sofort deutlich weniger Glyphosat eingesetzt
              wird,</li>

              </ul>

              <ul>

              <li>alle rechtlichen Methoden zur Einschränkung bzw. dem Einsatzstopp
              von Glyphosat vollständig auszuschöpfen.</li>

              </ul>

              <p><strong>Bienengefährliche Stoffe verbieten</strong></p>

              <p>Immer mehr Studien belegen eine Vielzahl von schädlichen Auswirkungen
              der Neonikotinoide oder ähnlich wirkender Wirkstoffe auf Bienen und
              andere Insekten. Sind diese den besonders schädlichen Giften ausgesetzt,
              können sie sich schlechter orientieren und fortpflanzen, schlechter
              lernen und kommunizieren und sind anfälliger für Krankheiten. Frankreich
              hat einen Ausstieg schon beschlossen, die EU-Kommission will inzwischen
              den Einsatz einiger Neonikotinoid-Wirkstoffe beenden. Deutschland muss
              den Vorschlag der EU-Kommission unterstützen. Aber das reicht nicht
              aus: <strong>Der Einsatz sämtlicher Neonikotinoide und ähnlich wirkender
              bienengefährdender Wirkstoffe muss beendet werden</strong>.</p>

              <p><strong>Ökolandbau voranbringen</strong></p>

              <p>Auf Öko-Höfen herrscht eine höhere biologische Vielfalt als auf konventionell
              bewirtschafteten Betrieben. Damit tragen diese auch zum Ziel einer insekten-
              und vogelfreundlichen Landwirtschaft bei. Wir brauchen deshalb einen
              deutlichen Ausbau des ökologischen Landbaus, was Flächen- und Marktanteile
              betrifft. <strong>Dazu wollen wir bis 2025 die ökologische Land- und
              Lebensmittelwirtschaft mit insgesamt einer Milliarde Euro weiter entwickeln.
              </strong>Wir brauchen daneben aber auch eine Ökologisierung der gesamten
              Landwirtschaft und Förderung pestizidfreier Nutzungsformen wie Streuobstwiesen
              – nicht zuletzt, weil Kontamination oder Abdrift aus konventionellen
              Betrieben sonst genau die trifft, die auf die Anwendung von Pestiziden
              freiwillig verzichten.</p>

              <p><strong>Naturschutz in der EU-Agrarfinanzierung stärken</strong></p>

              <p>Es ist dringend erforderlich, in der Agrarpolitik auch finanziell
              drastisch umzusteuern. Wir müssen weg kommen von einer finanziellen
              Förderung, die allein den Besitz von Fläche belohnt, wie das derzeit
              mit den jährlich 4,8 Millionen € aus der ersten Säule der Agrarpolitik
              passiert.</p>

              <p>Wir GRÜNE setzen uns dafür ein, dass <strong>Gelder aus öffentlichen
              Kassen nur noch für gesellschaftliche Leistungen</strong> der Landwirtschaft
              zu verwenden. Dazu müssen schon jetzt bestehende nationale Spielräume
              für den Schutz von Vögeln, Fledermäusen, Insekten und anderer Arten
              genutzt werden. <strong>Wir wollen die sofortige Umschichtung des jetzt
              schon möglichen Maximal-Anteils in die 2. Säule, um damit auch den Schutz
              der Biologischen Vielfalt besser zu finanzieren. </strong></p>

              <p>Wir werden außerdem für den <strong>Förderzeitraum nach 2020 auf
              eine Reform der EU-Agrarpolitik dränge</strong>n, hier muss gelten „<strong>Gesellschafliche
              Geld für gesellschaftliche Leistungen“</strong>. Wir wollen die Zahlung
              der GAP-Mittel dann konsequent an die Erbringung von Gemeinwohlleistungen
              durch die Landwirte (über gesetzliche Vorgaben hinaus) knüpfen. Denn
              wir wollen eine vielfältige Landwirtschaft fördern, die ohne Gift, Gentechnik
              und Tierleid gesundes Essen für alle erzeugt. Eine Landwirtschaft, in
              der die Leistungen unserer nachhaltig arbeitenden Landwirt*innen gewürdigt
              werden und die ihnen ein gutes Auskommen verschafft. Die unserem Klima
              nützt, statt ihm zu schaden. Die mit der Natur arbeitet und nicht gegen
              sie, die biologische Vielfalt schützt, statt zu zerstören. Landwirt*innen,
              die öffentliche Gelder erhalten, müssen nach diesen Grundsätzen wirtschaften.<br>

              Wir setzten uns für einen eigenständigen EU-Naturschutzfonds in Höhe
              von mindestens 15 Mrd. Euro jährlich ein. Dieser dient der Förderung
              von freiwilligen Naturschutzmaßnahmen beispielsweise zur Schaffung und
              Pflege zusätzlicher naturschutzfachlich wertvoller Bereiche bzw. Nutzungsverzichte
              etwa zum Schutz von Feld- und Wiesenvogelarten, die von Landnutzer*innen
              geleistet werden.</p>

              <p><strong>Grünland schützen</strong></p>

              <p>Knapp ein Drittel der landwirtschaftlichen Nutzfläche Deutschlands
              besteht aus Grünland. Grünlandstandorte beherbergen über die Hälfte
              aller in Deutschland vorkommenden Tier- und Pflanzenarten und haben
              somit auch große Bedeutung für den Schutz und den Erhalt der Artenvielfalt.
              Der Umbruch von Grünland und die Intensivierung der Nutzung auf den
              verbleibenden Flächen haben gravierende Auswirkungen auf die Artenvielfalt.
              So stehen heute z. B. fast alle typischen Wiesenvogelarten wie Kiebitz,
              Uferschnepfe und Braunkehlchen auf der Roten Liste der bedrohten Tierarten.
              Denn nur noch etwa 14 % der gesamten Grünlandfläche können als artenreiches
              Grünland eingestuft werden. Dabei haben artenreiche Flächen eine überaus
              hohe Bedeutung für den Erhalt der biologischen Vielfalt sowie den Gewässer-,
              Boden- und Klimaschutz.</p>

              <p>Wir setzen uns für eine umfassende <strong>Grünlandstrategie</strong>
              ein. Dazu gehört ein generelles Umbruchverbot auf sensiblen Standorten
              wie Niedermoorböden, Überschwemmungsgebieten, Standorten mit hohem Grundwasserstand,
              erosionsgefährdeten Flächen, Streuobstwiesen und artenreichem Grünland.
              Weiterhin die Einführung einer allgemeinen Genehmigungspflicht des Grünlandumbruchs
              auf allen Standorten mit Beurteilung durch Fachbehörden des Natur- und
              Wasserschutzes sowie die Verbesserung des Vollzugs bestehender rechtlicher
              Vorgaben vor allem in sensiblen Gebieten. Es braucht eine bessere Förderkulisse
              für den Erhalt von artenreichem Grünland durch höhere Weideprämien,
              Ausgleichszahlungen für benachteiligte Gebiete auf extensiv bewirtschafteten
              Flächen und Fördermaßnahmen zur Renaturierung und extensiven Nutzung
              von Mooren sowie eine flächengebundene Tierhaltung.</p>

              <p><strong>Bienen und Vögel brauchen unsere Kenntnis und unseren Schutz
              </strong></p>

              <p>Insekten sind die artenreichste Gruppe an Organismen und machen 70
              Prozent aller Tierarten in Deutschland aus. Doch die Datenlage ist schlecht
              – viele Arten sind noch gänzlich unbekannt oder ihr Vorkommen ist unzureichend
              dokumentiert. Eine flächendeckende Beobachtung und Zählung für Insekten
              gibt es nicht. Wir brauchen aber ein Bild davon, was wo lebt und wie
              sich Bestände verändern, um sie schützen zu können. Deshalb soll ein
              wissenschaftliches Bundesprogramm Forschung und Lehre stärken und interdisziplinär
              und problemorientiert zum Biodiversitätsschutz beitragen. Ein Bund-Länder-Programm
              zum <strong>Biodiversitätsmonitoring</strong> soll unverzüglich auf
              den Weg gebracht werden. Die gesammelten Erkenntnisse sollen über Open
              Data verfügbar gemacht werden. Dazu braucht es die Gründung eines nationalen
              Monitoringzentrums und im Rahmen dessen auch die Schaffung eines Kompetenznetzwerks
              für integrative Taxonomie.</p>

              <p><strong>Vielfältige und artenreiche Kulturlandschaft</strong></p>

              <p>Hecken, Blühstreifen, Knicks, Alleen und Wildwiesen bieten Insekten
              und Vögeln ein zu Hause – leider werden diese Lebensräume immer weniger,
              denn unsere vielfältige Landschaft wird immer monotoner. Neben der Landwirtschaft
              gefährdet die Zerschneidung v.a. durch Infrastruktur und Zerstörung
              von Lebensräumen die Vielfalt an Insekten und anderen Arten. Wir wollen
              eine vielfältige Landschaft fördern und genau diese Rückzugs- und Nistorte
              erhalten und wiederherstellen. Dazu braucht es mehr Geld. Wir wollen
              das <strong>Bundesprogramm Biologische Vielfalt auf 50 Millionen im
              Jahr aufstocken</strong>, damit Vögel in Hecken und Insekten in Altholz
              wieder ein zu Hause finden.</p>

              <p>Auch werden ungebremst Flächen zubetoniert. Der Flächenhunger und
              –verbrauch ist riesig. Vom Ziel den Flächenverbrauch bis 2020 auf 30
              Hektar pro Tag zu begrenzen, sind wir weit entfernt. Wir müssen den
              Flächenverbrauch begrenzen und der Natur ihren Raum lassen.</p>

              <p><strong>Gärten, Grünanlagen als Hort der Vielfalt</strong></p>

              <p>Allein die Gärten Deutschlands decken eine Fläche ab, die größer
              als das Saarland ist. Vielfältige Gärten, Dörfer und Grünanlagen in
              den Städten bieten deutlich mehr Tier- und Pflanzenarten Raum als intensiv
              genutzten Agrarlandschaften, in denen unsere Lebensmittel erzeugt werden.
              Naturnahe Nutzung statt blütenloser Steingärten, Pestizidverzicht und
              insektenfreundliche Blumenwiesen sowie einheimische Bäume und Sträucher
              sind wichtige Beiträge zur Biologischen Vielfalt in Städten und Dörfern.
              Naturerlebnisräume und Naturerfahrungsräume bieten insbesondere Kindern
              und Jugendlichen Spiel-, Erlebnis- und Beobachtungsräume und damit prägende
              Erfahrungen für ein positives Verhältnis zur Natur. Wir GRÜNE fordern
              die Einrichtung solcher Räume gerade in großen Städten und Ballungsräumen.</p>

              <p>Kommunen können durch Konzepte für bienenfreundliche Grünflächen-
              und Straßenrandbewirtschaftung, und entsprechende Anlagen an öffentlichen
              Einrichtungen (wie Kitagärten) einen wichtigen Beitrag gegen Blüten-
              und Lebensraummangel von Bestäubern leisten. Beratung zu bestäuberfreundlichen
              Gärten, Balkonen und Dachbegrünungen für Privatleute, ergänzt durch
              ein entsprechendes Pflanzenangebot in Gartenmärkten und Gärtnereien,
              würde alle unterstützen, die in ihrem direkten Umfeld etwas für Bienen
              tun wollen.</p>

              <p><strong>Mehr Wildnis in Deutschland</strong></p>

              <p>Die Agrarlandschaft prägt fast die Hälfte unserer Landschaften, aber
              Vögel und Insekten und andere Arten brauchen auch ungestörte Rückzugsorte,
              Wildnis. Deshalb sollen 2% der Landesfläche Deutschlands Wildnis werden.
              Dafür wollen wir konkrete Anreize schaffen und diese Gebiete als „Wildnisgebiet“
              mit Verordnungsrahmen nach dem Bundesnaturschutzgesetz unter Schutz
              stellen. Wir fordern einen <strong>Wildnisfonds</strong> in Höhe von
              500 Mio. Euro in Deutschland. Außerdem fördern wir den Waldumbau zu
              <strong>naturnahen Wäldern</strong> und werden das Ziel die natürliche
              Waldentwicklung auf 5% des Gesamtwaldes vorantreiben.</p>

              <p><strong>Artenschutz mitdenken </strong></p>

              <p>Auch am Meer sind Vögel gefährdet. Stellnetze der Fischerei bedrohen
              nicht nur Schweinwale sondern auch alle Seevögel, die tauchend ihre
              Nahrung suchen, wie zum Beispiel Eiderente, Seetaucher. Diese verfangen
              sich darin und ertrinken qualvoll. Stellnetzfischerei wird auch in Naturschutzgebieten
              betrieben. Wir fordern deshalb, ein sofortiges Ende der Stellnetz- und
              Grundschleppnetzfischerei in Naturschutzgebieten. Mittelfristig dürfen
              in der gesamten Ost- und Nordsee nur noch selektive und umweltschonende
              Fischfangmethoden zum Einsatz kommen, um die Fischerei in Einklang mit
              der Meeresumwelt zu bringen.</p>

              <p>Um Vögel vor tödlichen Kollisionen oder Stromschlägen an Stromleitungen
              zu schützen, wollen wir, dass Freileitungen – zunächst in Naturschutzgebieten
              und Vogelzugkorridoren – durch Vogelschutzmarkierungen nachgerüstet
              werden. Auch für große Glasscheiben und –fronten muss überlegt werden,
              wie der Vogelschlag verringert werden kann. Ebenso muss der Schutz von
              Vögeln und Fledermäusen bei der Errichtung von Windenergieanlagen durch
              technische Anpassungen sowie gute Planung auf der Basis unabhängiger
              Studien gewährleistet werden. Rund 60 Prozent der wirbellosen Arten
              weltweit sind nachtaktiv. Zum Schutz insbesondere von Insekten setzen
              wir uns für weniger Lichtverschmutzung ein – u.a. indem wir moderne
              Techniken wie nächtliche Abschaltmechanismen stärken.</p></div>'
            layout_right: false
