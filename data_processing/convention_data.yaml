    - '537':
        type: motion
        id: 537
        agenda_item: Beschlüsse (vorläufig)
        prefix: V-18 Beschluss
        title: Für einen neuen europäischen Aufbruch
        title_with_intro: Für einen neuen europäischen Aufbruch
        title_with_prefix: 'V-18 Beschluss: Für einen neuen europäischen Aufbruch'
        status_id: 3
        status_title: Eingereicht
        date_published: null
        supporters: []
        initiators:
          type: null
          name: null
          organization: null
        initiators_html: 'Bundesdelegiertenkonferenz (beschlossen am: 27.01.2018)'
        sections:
        - Antragstext:
            type: TextSimple
            title: Antragstext
            html: '<div class="text motionTextFormattings textOrig"><p>Die Europäische
              Union ist auf Ruinen zweier verheerender Weltkriege von Menschen aufgebaut
              worden, die sich noch Jahre zuvor auf dem Schlachtfeld begegnet waren.
              Ohne Visionen, Ideen und praktischen Mut wäre dieses Wunder europäischer
              Einigung niemals möglich gewesen.</p>

              <p>Das ist nun sechzig Jahre her. Wir haben weiterhin den festen Willen,
              einen immer engeren Zusammenschluss Europas zu schaffen (ever closer
              Union). Visionen, Ideen, Mut und Weitsicht braucht es jetzt wieder.
              Wir brauchen einen neuen Aufbruch. Präsident Macron und Präsident Juncker
              haben mit ihren Vorschlägen ein Fenster geöffnet. Ob diese Initiativen
              Ausgangspunkt für eine institutionelle und politische Erneuerung der
              EU werden hängt nicht zuletzt von Deutschlands Antwort ab. Jetzt muss
              gehandelt werden. Wir wollen als Bündnis 90/Die Grünen dazu beitragen,
              dass Deutschland bei der notwendigen Demokratisierung und Reform der
              Eurozone und der Reform europäischer Institutionen eine aktive und partnerschaftliche
              und keine blockierende Rolle einnimmt.</p>

              <p>Es wäre für Bündnis 90/Die Grünen inakzeptabel, wenn das Fenster
              der günstigen Gelegenheit für einen Aufbruch in Europa, das derzeit
              noch offen steht, sich schließen würde, bevor Berlin aussage- und handlungsfähig
              ist. Deshalb wollen wir, dass der Bundestag Initiativen ergreift, um
              die ausgestreckte Hand von Präsident Macron und die Impulse aus Europäischem
              Parlament und Europäischer Kommission willkommen zu heißen und mit eigenen
              Beiträgen partnerschaftlich weiterzuentwickeln.</p>

              <p><strong>Für uns ist 2018 das Jahr der europäischen Erneuerung</strong></p>

              <p>Als Grüne sind wir geleitet von einer europäischen Vision, die auf
              vier Zielen fußt. Wir wollen ein Europa, das die Vielfalt schätzt. Ein
              Europa, das seine Bürgerinnen und Bürger schützt. Ein Europa, das Selbstbestimmung
              stärkt. Ein Europa, das die globale ökologische Transformation anpackt,
              das Frieden achtet und Menschenrechte in der Welt stärkt .</p>

              <p>Vielfalt schätzen, das thematisiert kulturelle Diversität, die Genderfragen,
              die Rechte von Minderheiten, den Umgang mit Flüchtlingen, die zu uns
              kommen, das Prinzip der Subsidiarität und eine Kultur des Respekts.
              Die Bürger zu schützen, durch Solidarität, das meint das Ernstnehmen
              und den Ausbau der sozialen Säule der EU, das meint Sicherheit nach
              innen und nach außen, es meint das Zurückschneiden übermächtiger Lobbyinteressen;
              es meint auch Daten- und Verbraucherschutz, fairen Außenhandel und verantwortliche
              Klimapolitik. Steuergerechtigkeit ist ein wichtiger Baustein dieser
              Transformation. Entsolidarisierung zu Lasten des Gemeinwohls bekämpfen
              wir. Die Stärkung von Selbstbestimmung will mehr Demokratie, die Gewährleistung
              des Rechtsstaates, die Sicherung der Menschen- und Bürgerrechte, gerade
              auch in Zeiten der digitalen Revolution. Selbstbestimmung stärken heißt,
              den autoritär-nationalistisch-populistischen Bewegungen konsequent entgegentreten.
              Es heißt auch, nicht zuzulassen, dass immer mehr Menschen sich in der
              Demokratie nicht mehr beheimatet finden, weil sie nicht sehen, dass
              sie selbst etwas bewegen können oder wenigstens repräsentiert werden,
              weil sie glauben, dass sie im Prozess von Globalisierung, Digitalisierung
              und Europäisierung abgehängt sind. Die ökologische Transformation, der
              &quot;Green New Deal&quot;, thematisiert nicht nur Klimapolitik, Energiepolitik,
              Landwirtschaft oder Verkehr. Sie adressiert auch die Frage der sozialen
              Gerechtigkeit, eines fairen Übergangs und die Frage der ökonomischen
              Perspektiven, einschließlich des Kampfes für Markt- statt Machtwirtschaft.
              Und sie thematisiert unsere internationale Verantwortung bei der ökologischen
              Transformation. Es heißt, internationale Institutionen zu stärken, etwa
              die UNO. Kein Land ist allein in der Lage, internationalen Herausforderungen
              erfolgreich zu begegnen. Es heißt, endlich eine restriktive Rüstungsexportpolitik
              zu betreiben und durch eine gerechtere Gestaltung der Globalisierung
              allen Staaten Wohlstand zu ermöglichen. Die EU muss verstärkt auf zivile
              Krisenprävention, Abrüstung und Multilateralismus setzen.</p>

              <p>Alle diese Fragen diskutieren und verfechten Bündnis 90/Die Grünen
              seit langem. Wir wollen sie bewusst europäisch ansprechen. Deshalb werden
              der Bundesvorstand und die Landesvorstände von Bündnis 90/Die Grünen
              aufgefordert, im ersten Halbjahr 2018 bundesweit und kampagnenmäßig
              „europäische Dialoge“ über die Gestaltung der Zukunft der EU zu organisieren.
              Diese Bemühungen haben das Ziel, die europäische Politik demokratischer
              und die deutsche Politik europäischer zu machen. Dazu soll gezielt die
              Zusammenarbeit mit zivilgesellschaftlichen Gruppen, mit Verbänden oder
              auch mit anderen Parteien gesucht werden. Ziel ist es, die Ergebnisse
              der europäischen Dialoge in die parlamentarische Arbeit und das Europawahlprogramm
              von Bündnis 90/Die Grünen sowie das Wahlmanifest der Europäischen Grünen
              Partei einzuspeisen. Die Abgeordneten auf Landes-, Bundes- und Europaebene
              werden gebeten, sich aktiv in diese Dialoge einzubringen. Nach Möglichkeit
              wollen wir europäische Partner in unsere Diskussionen einbeziehen, ob
              es Vertreter*innen anderer grüner Parteien sind oder Vertreter*innen
              von Partnerstädten und Partnerhochschulen oder von Partnerunternehmen
              in anderen Ländern. Wir wollen rechtzeitig vor dem Europawahlkampf auch
              diskutieren, wie wir den so führen können, dass dabei für die Bürgerinnen
              und Bürger neues Engagement, neues Vertrauen und mehr demokratische
              Selbstbestimmung möglich werden.</p>

              <p>Ziel ist es, in diesen Diskussionen mit den Bürgerinnen und Bürgern
              Prioritäten zu erarbeiten. Ideal wäre es, wenn wir am Schluss zu einem
              10-Punkte-Programm kämen, wie wir es in der Bundestagswahl hatten.</p></div>'
            layout_right: false
        - Begründung:
            type: TextSimple
            title: Begründung
            html: <div class="text motionTextFormattings textOrig"><p></p></div>
            layout_right: false
        proposed_procedure: null
